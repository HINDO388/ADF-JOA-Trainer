<link rel="icon" type="image/png" sizes="64x64" href="./favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="shortcut icon" type="image/png" href="./favicon-light.png">
<link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-light.png">
<script>
(function(){
  const link = document.getElementById("appleTouchIcon");
  if (!link || !window.matchMedia) return;
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const apply = () => {
    link.href = mq.matches ? "./apple-touch-icon-dark.png" : "./apple-touch-icon-light.png";
  };
  apply();
  if (mq.addEventListener) mq.addEventListener("change", apply);
  else if (mq.addListener) mq.addListener(apply);
})();
</script>

<style>
:root{
  /* Air Force-inspired palette: blue, white and red.
     This is an independent trainer, not an official Air Force visual identity implementation. */
  --bg:#eef5f9; --panel:#ffffff; --ink:#0d2941; --muted:#61798b; --line:#c9d9e4;
  --nav:#082f4f; --nav2:#124e78; --accent:#c92d3b; --accent2:#a91f2d;
  --sky:#68a9cf; --sky-deep:#327ba8; --sky-soft:#e5f2f8;
  --good:#1f7555; --warn:#9a6700; --bad:#b22d3a; --soft:#e7f1f6; --flag:#e9b83e;
  --shadow:0 8px 24px rgba(8,47,79,.09);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;touch-action:manipulation}
button{cursor:pointer}
a{color:#1a5d82}
.hidden{display:none!important}
.shell{min-height:100vh;min-height:100dvh}
.topbar{background:linear-gradient(90deg,var(--nav),#0b3c61);color:#fff;padding:calc(14px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) 14px calc(24px + env(safe-area-inset-left));display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.18);border-bottom:3px solid var(--sky)}
.brand{font-weight:850;letter-spacing:.02em;font-size:19px;white-space:nowrap;display:inline-flex;align-items:center;gap:.28em;line-height:1}
.brand span{color:#f2f7fa}.brand:before{content:"";display:block;flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:8px;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.topnav{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.topnav button{border:0;background:transparent;color:#dbe3e8;padding:9px 12px;border-radius:8px;font-weight:700;min-height:44px}
.topnav button:hover,.topnav button.active{background:var(--nav2);color:white}
.container{max-width:1180px;margin:0 auto;padding:28px 22px 50px}
.hero{display:grid;grid-template-columns:1.4fr .85fr;gap:24px;align-items:stretch;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.hero-main{padding:30px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--sky-deep);margin-bottom:8px}
h1{font-size:38px;line-height:1.05;margin:0 0 12px}
h2{margin:0 0 14px;font-size:26px}
h3{margin:0 0 10px;font-size:19px}
p{line-height:1.55}
.lead{font-size:18px;color:#3f505b;max-width:800px}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:#475862}
.badge.high{border-color:#a8d2bf;color:#176343;background:#f0faf5}
.badge.medium{border-color:#e4c687;color:#855700;background:#fff9ea}
.badge.official{border-color:#b9c8d2;color:#324c5d;background:#f4f8fa}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.stat{background:linear-gradient(180deg,#f8fbfd,var(--soft));border:1px solid #d5e4ed;border-radius:11px;padding:15px}
.stat b{display:block;font-size:25px}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.hero-side{padding:24px;display:flex;flex-direction:column;justify-content:space-between}
.notice{padding:13px 15px;border-left:4px solid var(--accent);background:#fff4f5;border-radius:8px;color:#5b2630;font-size:14px;line-height:1.45}
.notice.blue{border-left-color:var(--sky-deep);background:var(--sky-soft);color:#234a63}
.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:800;background:var(--accent);color:#fff;min-height:44px}
.btn:hover{background:var(--accent2)}
.btn.secondary{background:#dfeef6;color:#183d56}
.btn.secondary:hover{background:#cfe4ef}
.btn.ghost{background:white;color:#26343e;border:1px solid var(--line)}
.btn.small{padding:8px 11px;font-size:13px;min-height:40px}
.btn.good{background:var(--good)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.category-card{padding:20px;position:relative;overflow:hidden}
.category-card .num{font-size:38px;font-weight:900;color:#cbdfea;position:absolute;right:16px;top:10px}
.category-card ul{padding-left:18px;color:#4f5e67;line-height:1.7}
.category-card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.section{margin-top:28px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}
.section-head p{margin:0;color:var(--muted)}
.mock-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mock-card{padding:18px}
.mock-card .mockno{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mock-card strong{display:block;font-size:20px;margin:6px 0}
.mock-card p{font-size:13px;color:var(--muted);min-height:42px}
.progress-strip{height:7px;background:#e6ecef;border-radius:999px;overflow:hidden;margin:12px 0}
.progress-strip span{display:block;height:100%;background:var(--accent)}
.practice-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}
.sidebar{padding:18px;align-self:start;position:sticky;top:82px}
.side-title{font-weight:900;margin-bottom:10px}
.side-list{display:grid;gap:7px}
.side-list button{text-align:left;padding:10px;border:1px solid transparent;background:#f5f7f8;border-radius:8px;font-weight:750;color:#354650;min-height:44px}
.side-list button.active{border-color:#8ebbd5;background:#e9f4fa;color:#164f73}
.practice-main{padding:22px}
.practice-header{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.practice-header h2{margin-bottom:12px}
.practice-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.practice-badges .basis-badge{white-space:normal;line-height:1.3}
.practice-banknote{display:block;margin-top:12px;font-size:12px;line-height:1.45;color:var(--muted);font-weight:650}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:14px;background:#f7f9fa;border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
.field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.field select{padding:10px 36px 10px 10px;border:1px solid #cfd8dd;border-radius:8px;background:white;min-height:44px}
.helpbox{border:1px solid #cfdbe2;border-radius:11px;background:#f7fbfd;padding:18px;margin-bottom:18px}
.helpbox summary{font-weight:900;cursor:pointer}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:13px}
.help-grid ul{margin:5px 0;padding-left:18px;line-height:1.55;color:#40525d}
.workedbox{border:1px solid #b9d2e1;border-radius:11px;background:#ffffff;padding:18px;margin-bottom:18px;box-shadow:0 4px 14px rgba(8,47,79,.05)}
.workedbox summary{font-weight:900;cursor:pointer;color:#174c6d}
.worked-intro{font-size:13px;color:var(--muted);margin:10px 0 14px}
.worked-examples{display:grid;gap:14px}
.worked-example{border:1px solid #d7e4ec;border-left:4px solid var(--sky-deep);border-radius:9px;padding:15px;background:#f9fcfd}
.worked-example h4{margin:0 0 8px;font-size:15px;color:#173e58}
.worked-question{font-weight:800;margin-bottom:9px}
.worked-steps{margin:0;padding-left:20px;line-height:1.55;color:#40596a}
.worked-steps li{margin:4px 0}
.worked-answer{margin-top:10px;padding:8px 10px;border-radius:7px;background:var(--sky-soft);font-weight:800;color:#174c6d}
.tip-chip{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;background:#dcecf5;color:#285c7b;border-radius:999px;padding:4px 8px;margin-bottom:8px}
.drill-card{border-top:4px solid var(--sky-deep);padding:22px}
.qmeta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}
.qmeta .left{display:flex;gap:8px;flex-wrap:wrap}
.prompt{font-size:18px;font-weight:760;line-height:1.45;margin:12px 0 18px}
.sequence{font-size:24px;font-weight:850;letter-spacing:.06em;text-align:center;padding:18px;background:#f7f9fa;border-radius:10px;margin:10px 0 18px}
.matrix{margin:10px auto 18px;border-collapse:collapse}
.matrix td{width:64px;height:54px;text-align:center;border:2px solid #6c7981;font-size:21px;font-weight:800;background:white}
.options{display:grid;gap:9px}
.option{border:1px solid #cfd7dc;border-radius:9px;background:white;padding:12px 14px;text-align:left;display:flex;gap:11px;align-items:center;transition:.12s;min-height:48px}
.option:hover{border-color:#9fb2bd;background:#f8fbfc}
.option.selected{border-color:var(--sky-deep);background:#eaf5fb}
.option.correct{border-color:#66a988;background:#effaf5}
.option.wrong{border-color:#d58d8d;background:#fff2f2}
.option .letter{width:27px;height:27px;border-radius:50%;background:#edf1f3;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto}
.visual-options{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:12px}
.visual-option{border:1px solid #cfd7dc;border-radius:10px;padding:10px;background:white;text-align:center;min-height:112px}
.visual-option.selected{border-color:var(--sky-deep);background:#eaf5fb}
.visual-option.correct{border-color:#66a988;background:#effaf5}
.visual-option.wrong{border-color:#d58d8d;background:#fff2f2}
.fig{display:flex;justify-content:center;align-items:center;min-height:88px}
.answer-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.numinput{padding:11px 12px;border:1px solid #bfcbd2;border-radius:8px;width:190px;font-size:18px;min-height:48px}
.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;border-left:4px solid #8aa1ae;background:#f4f7f8}
.feedback.good{border-left-color:var(--good);background:#f1faf5}
.feedback.bad{border-left-color:var(--bad);background:#fff2f2}
.feedback b{display:block;margin-bottom:5px}
.test-shell{background:linear-gradient(to bottom,var(--nav) 0,var(--nav) env(safe-area-inset-top),#fff env(safe-area-inset-top),#fff 100%);min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.test-head{min-height:44px;background:#e7eaec;border-bottom:1px solid #bfc6ca;padding:7px 12px;font-weight:850;font-size:13px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}.test-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.test-qcount{white-space:nowrap}.test-exit{border:1px solid #b9c3c9;background:#fff;color:#7d2630;border-radius:7px;min-height:34px;padding:5px 10px;font-weight:900}.test-exit:hover{background:#fff2f3;border-color:#d09a9f}
.test-body{display:grid;grid-template-columns:185px 1fr;min-height:calc(100vh - 99px)}
.test-side{background:#e4e6e7;border-right:1px solid #b9c0c4;padding:12px;display:flex;flex-direction:column}
.status-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:8px 0 15px}
.status-grid button{border:1px solid #aeb7bc;background:#f8f9f9;height:25px;font-size:10px;padding:0}
.status-grid button.answered{background:#c7d1d6}
.status-grid button.flagged{outline:2px solid var(--flag);outline-offset:-2px}
.status-grid button.current{background:var(--sky-deep);color:white;border-color:var(--sky-deep)}
.legend{font-size:11px;display:grid;gap:6px;color:#43515a}
.legend span i{display:inline-block;width:13px;height:13px;border:1px solid #abb4b9;vertical-align:-2px;margin-right:5px;background:white}
.legend span i.ans{background:#c7d1d6}
.legend span i.flg{border:2px solid var(--flag)}
.timerbox{margin-top:auto;border-top:1px solid #aab2b7;padding-top:12px}
.timerbar{height:13px;background:#c7d0d4;border:1px solid #98a4aa}
.timerbar span{height:100%;display:block;background:var(--sky-deep);width:100%}
.time{font-weight:900;font-variant-numeric:tabular-nums;margin-top:5px}
.test-main{display:flex;flex-direction:column}
.test-question{flex:1;padding:28px 36px 20px;max-width:1050px;width:100%;margin:0 auto}
.test-nav{background:#e5e7e8;border-top:1px solid #b8c0c4;padding:11px 18px;display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;z-index:20;padding-bottom:max(11px,env(safe-area-inset-bottom))}
.test-nav .middle{display:flex;gap:8px}
.result-card{padding:24px}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.result-stat{padding:15px;background:#f3f6f7;border-radius:10px}
.result-stat b{font-size:26px;display:block}
.breakdown{width:100%;border-collapse:collapse;margin-top:12px}
.breakdown th,.breakdown td{text-align:left;border-bottom:1px solid var(--line);padding:10px}
.review-item{padding:18px;border:1px solid var(--line);border-radius:10px;margin-top:10px;background:white}
.sources{display:grid;gap:12px}
.source-card{padding:18px}
.source-card h3{display:flex;align-items:center;gap:8px}
.source-card p{margin-bottom:0;color:#4f606a}
.fidelity-table{width:100%;border-collapse:collapse;background:white}
.fidelity-table th,.fidelity-table td{border-bottom:1px solid var(--line);padding:11px;text-align:left;vertical-align:top}
.fidelity-table th{background:#f4f7f8}
.footer{margin-top:35px;color:#6c7880;font-size:12px;line-height:1.5}
.version-stamp{font-size:9px;line-height:1;color:rgba(97,121,139,.72);text-align:center;letter-spacing:.04em;padding:8px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));user-select:none}

.smallnote{font-size:12px;color:var(--muted)}
.svg-seq{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
.svg-frame{width:102px;height:88px;border:1px solid #cbd4d9;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}


/* Difficulty badges are assigned from the actual generated rule complexity, not just the requested band. */
.badge.diff-easy{border-color:#a8d2bf;color:#176343;background:#f0faf5}
.badge.diff-medium{border-color:#d6bd74;color:#76510a;background:#fff9ea}
.badge.diff-hard{border-color:#d79aa2;color:#8d2430;background:#fff1f3}
.difficulty-audit{margin-top:8px;font-size:11px;line-height:1.45;color:var(--muted)}

/* Category drills open as an in-page modal so the first question cannot appear unnoticed below the fold. */
body.drill-open{overflow:hidden}
.drill-modal{position:fixed;inset:0;z-index:120;background:rgba(5,31,51,.72);display:flex;align-items:flex-start;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch}
.drill-dialog{width:min(920px,100%);background:var(--panel);border:1px solid #b9cfdd;border-radius:16px;box-shadow:0 22px 70px rgba(2,26,44,.32);overflow:hidden;margin:auto}
.drill-modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;background:linear-gradient(90deg,var(--nav),#0b3c61);color:#fff;border-bottom:3px solid var(--sky)}
.drill-modal-head strong{font-size:15px}
.drill-modal-head .smallnote{color:#dceaf2}
.drill-close{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.10);color:#fff;border-radius:8px;min-width:44px;min-height:40px;padding:7px 11px;font-weight:800}
.drill-dialog .drill-card{border-top:0}

/* Full-test difficulty groups and persistent test history. */
.mock-tier{margin-top:24px}
.mock-tier:first-of-type{margin-top:0}
.mock-tier-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
.mock-tier-head p{margin:4px 0 0;color:var(--muted);max-width:780px}
.tier-pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.tier-pill.easier{background:#eef9f4;color:#176343;border:1px solid #acd4c1}
.tier-pill.joa{background:#eaf4fa;color:#1d5d82;border:1px solid #a7c9dd}
.tier-pill.harder{background:#fff1f3;color:#8d2430;border:1px solid #d9a0a7}
.history-actions{display:flex;gap:8px;flex-wrap:wrap}
.history-list{display:grid;gap:12px;margin-top:16px}
.history-item{padding:18px}
.history-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.history-title{font-weight:900;font-size:17px;margin-bottom:5px}
.history-meta{font-size:12px;color:var(--muted);line-height:1.55}
.history-score{font-size:26px;font-weight:900;color:var(--ink);white-space:nowrap}
.history-stats{display:flex;gap:12px;flex-wrap:wrap;margin:13px 0;color:#496071;font-size:13px}
.history-empty{padding:24px;text-align:center;color:var(--muted)}
.danger-btn{background:#fff;color:var(--bad);border:1px solid #d9a0a7}
.danger-btn:hover{background:#fff1f3}

.mobile-test-tools{display:none}
.mobile-status-scroll{display:flex;gap:5px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mobile-status-scroll::-webkit-scrollbar{display:none}
.mobile-status-scroll button{flex:0 0 38px;height:38px;border:1px solid #aeb7bc;background:#f8f9f9;border-radius:7px;font-size:12px;font-weight:800}
.mobile-status-scroll button.answered{background:#c7d1d6}
.mobile-status-scroll button.flagged{outline:2px solid var(--flag);outline-offset:-2px}
.mobile-status-scroll button.current{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep)}
.mobile-test-topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mobile-test-tools .timerbar{flex:1;min-width:120px}
.mobile-test-tools .time{margin:0;white-space:nowrap;font-size:13px}
.mobile-swipe-note{display:none;font-size:11px;color:var(--muted);text-align:center;margin:4px 0 0}

@media(max-width:1024px){
 .container{padding-left:20px;padding-right:20px}
 .mock-grid{grid-template-columns:repeat(2,1fr)}
 .hero{gap:18px}
}

@media(max-width:900px){
 .hero,.practice-layout{grid-template-columns:1fr}
 .hero-main{padding:26px}
 .grid3{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(2,1fr)}
 .sidebar{position:static;padding:10px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 .sidebar::-webkit-scrollbar{display:none}
 .sidebar .side-title{display:none}
 .sidebar .side-list{display:flex;gap:7px;flex:0 0 auto}
 .sidebar .side-list button{white-space:nowrap}
 .practice-main{padding:20px}
 .help-grid{grid-template-columns:1fr}
 .test-question{padding:24px 24px 18px}
 .result-grid{grid-template-columns:repeat(2,1fr)}
 .source-card h3{flex-wrap:wrap}
 .fidelity-table{font-size:13px}
}

@media(max-width:820px){
 .test-body{grid-template-columns:1fr;min-height:calc(100dvh - 99px)}
 .test-side{display:none}
 .mobile-test-tools{display:block;background:#eef3f6;border-bottom:1px solid #bdcbd4;padding:10px 14px}
 .mobile-swipe-note{display:block}

function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }
function ri(r,min,max){ return Math.floor(r()*(max-min+1))+min; }
function pick(r,arr){ return arr[Math.floor(r()*arr.length)]; }
function shuffle(r,arr){ const x=[...arr]; for(let i=x.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[x[i],x[j]]=[x[j],x[i]];} return x; }
function fmt(n){ return Number.isInteger(n)?String(n):String(Math.round(n*100)/100); }
function uniqOptions(correct, vals, r){
  const a=[correct,...vals].map(v=>typeof v==="number"?Math.round(v*100)/100:v);
  const unique=[]; a.forEach(v=>{if(!unique.some(x=>String(x)===String(v))) unique.push(v)});
  while(unique.length<4){ let v=typeof correct==="number"?correct+ri(r,-9,9):"Option "+unique.length; if(!unique.some(x=>String(x)===String(v))) unique.push(v); }
  return shuffle(r,unique.slice(0,4));
}
function qbase(seed, subtype, difficulty){return {id:`${subtype}-${seed}`,subtype,category:SUBTYPES[subtype].cat,difficulty};}

function requestedBand(d){ return ["easy","medium","hard"].includes(d)?d:"medium"; }
function setDifficulty(q,d,reason){ q.difficulty=d; q.difficultyReason=reason; return q; }

function genNumSeries(seed,difficulty="medium"){
  const r=rng(seed), band=requestedBand(difficulty), q=qbase(seed,"numSeries",band);
  let seq=[],ans,rule,reason;
  const type=ri(r,0,2);
  if(band==="easy"){
    if(type===0){
      const a=ri(r,2,20),d=ri(r,2,9); seq=[a,a+d,a+2*d,a+3*d,a+4*d]; ans=a+5*d;
      rule=`add ${d} each time`; reason="One obvious arithmetic rule with a constant difference.";
    }else if(type===1){
      let a=ri(r,3,15),b=ri(r,16,30); if(a===b)b++;
      seq=[a,b,a,b,a,b]; ans=a; rule=`alternate ${a}, ${b}`;
      reason="A simple two-value alternation (A, B, A, B...). This is always Easy, including patterns such as 8, 18, 8, 18...";
    }else{
      const a=ri(r,2,7),m=pick(r,[2,3]); seq=[a,a*m,a*m*m,a*m*m*m]; ans=a*m*m*m*m;
      rule=`multiply by ${m} each time`; reason="One obvious repeated multiplication rule.";
    }
  }else if(band==="medium"){
    if(type===0){
      const a=ri(r,3,12),d=ri(r,2,5),inc=ri(r,1,3); seq=[a];
      for(let i=0;i<4;i++)seq.push(seq.at(-1)+d+i*inc); ans=seq.at(-1)+d+4*inc;
      rule=`the differences increase by ${inc}: ${[0,1,2,3,4].map(i=>d+i*inc).join(", ")}`;
      reason="Requires a second-level pattern in the differences, but only one derived sequence.";
    }else if(type===1){
      const a=ri(r,8,25),up=ri(r,5,11),down=ri(r,2,6); seq=[a];
      for(let i=0;i<5;i++)seq.push(seq.at(-1)+(i%2===0?up:-down)); ans=seq[5]; seq=seq.slice(0,5);
      rule=`alternate +${up}, −${down}`; reason="Requires recognising two alternating arithmetic operations.";
    }else{
      const base=ri(r,3,12),step=ri(r,3,9); seq=[base,base+step,base+step,base+2*step,base+2*step]; ans=base+3*step;
      rule=`each new value is repeated twice while increasing by ${step}`; reason="Requires noticing both repetition and a separate arithmetic progression.";
    }
  }else{
    if(type===0){
      const a=ri(r,2,10),b=ri(r,18,35),d1=ri(r,2,6),d2=ri(r,3,8); seq=[a,b,a+d1,b+d2,a+2*d1,b+2*d2]; ans=a+3*d1;
      rule=`two interleaved sequences: odd positions +${d1}, even positions +${d2}`;
      reason="Requires splitting the terms into two interleaved sequences and solving the correct strand.";
    }else if(type===1){
      const a=ri(r,2,6),d=ri(r,1,3); seq=[a]; let diff=d;
      for(let i=0;i<4;i++){seq.push(seq.at(-1)+diff);diff*=2;} ans=seq.at(-1)+diff;
      rule="the amount added doubles after each step"; reason="Requires deriving a changing-difference rule whose increments themselves grow geometrically.";
    }else{
      const a=ri(r,2,6),m=pick(r,[2,3]),add=ri(r,2,6); seq=[a];
      seq.push(seq.at(-1)*m); seq.push(seq.at(-1)+add); seq.push(seq.at(-1)*m); seq.push(seq.at(-1)+add); ans=seq.at(-1)*m;
      rule=`alternate ×${m}, then +${add}`; reason="Requires identifying and maintaining two different alternating operations under time pressure.";
    }
  }
  q.prompt="What number comes next?"; q.display={type:"sequence",values:[...seq,"?"]};
  q.kind="single"; q.options=uniqOptions(ans,[ans+ri(r,1,5),ans-ri(r,1,5),ans+ri(r,6,12)],r); q.answer=ans;
  q.explanation=`The rule is: ${rule}. Therefore the missing value is ${ans}.`;
  return setDifficulty(q,band,reason);
}

function matrixPlausiblePredictions(grid){
 const rows=grid.map(row=>row.map(v=>v===null?null:v));
 const a3=rows[2][0],b3=rows[2][1],preds=[];
 const funcs=[];
 const add=(name,fn)=>funcs.push([name,fn]);
 add("a+b",(a,b)=>a+b);add("a-b",(a,b)=>a-b);add("b-a",(a,b)=>b-a);add("a*b",(a,b)=>a*b);
 add("2a+b",(a,b)=>2*a+b);add("a+2b",(a,b)=>a+2*b);add("2a-b",(a,b)=>2*a-b);add("2b-a",(a,b)=>2*b-a);
 for(const m of [2,3,4]){add(`(a+b)*${m}`,(a,b)=> (a+b)*m);add(`a*${m}+b`,(a,b)=>a*m+b);add(`a+b*${m}`,(a,b)=>a+b*m);}
 for(let k=-6;k<=6;k++){add(`a+b+${k}`,(a,b)=>a+b+k);add(`a*b+${k}`,(a,b)=>a*b+k);}
 for(const [name,fn] of funcs){if(fn(rows[0][0],rows[0][1])===rows[0][2]&&fn(rows[1][0],rows[1][1])===rows[1][2])preds.push({name,value:fn(a3,b3)});}
 return preds;
}
function matrixIsClear(grid,intendedAnswer){
 if(grid[0][0]===grid[1][0]&&grid[0][1]===grid[1][1])return false;
 const preds=matrixPlausiblePredictions(grid),values=[...new Set(preds.map(x=>x.value))];
 return values.length===1&&values[0]===intendedAnswer;
}

function genNumMatrix(seed,difficulty="medium"){
  const r=rng(seed),band=requestedBand(difficulty),q=qbase(seed,"numMatrix",band); let grid,ans,rule,reason;
  const type=band==="easy"?ri(r,0,3):ri(r,0,2);
  if(band==="easy"){
    if(type===0){
      const rows=Array.from({length:3},()=>{const a=ri(r,2,12),b=ri(r,2,12);return [a,b,a+b]}); ans=rows[2][2]; rows[2][2]=null; grid=rows;
      rule="in each row, third = first + second"; reason="A single direct addition relationship repeated across rows.";
    }else if(type===1){
      const rows=Array.from({length:3},()=>{const b=ri(r,2,8),c=ri(r,2,9),a=b+c;return [a,b,c]}); ans=rows[2][2]; rows[2][2]=null; grid=rows;
      rule="in each row, third = first − second"; reason="A single direct subtraction relationship repeated across rows.";
    }else if(type===2){
      const a=ri(r,2,10),h=ri(r,2,5),v=ri(r,2,5); grid=[[a,a+h,a+2*h],[a+v,a+v+h,a+v+2*h],[a+2*v,a+2*v+h,null]]; ans=a+2*v+2*h;
      rule=`move right +${h}; move down +${v}`; reason="A simple constant-step grid; either the row or column pattern leads directly to the same answer.";
    }else{
      const rows=Array.from({length:3},()=>{const a=ri(r,2,9),b=ri(r,2,7);return [a,b,a*b]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule="in each row, third = first × second"; reason="One direct multiplication relationship repeated across rows.";
    }
  }else if(band==="medium"){
    if(type===0){
      const rows=Array.from({length:3},()=>{const a=ri(r,2,9),b=ri(r,2,9);return [a,b,a+2*b]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule="in each row, third = first + (2 × second)"; reason="A consistent two-step arithmetic rule must be inferred from complete rows.";
    }else if(type===1){
      const rows=Array.from({length:3},()=>{const a=ri(r,2,9),b=ri(r,2,9);return [a,b,2*a+b]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule="in each row, third = (2 × first) + second"; reason="A consistent two-step arithmetic rule must be inferred from complete rows.";
    }else{
      const k=ri(r,2,6),rows=Array.from({length:3},()=>{const a=ri(r,3,10),b=ri(r,2,9);return [a,b,a+b+k]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule=`in each row, third = first + second + ${k}`; reason="A two-step additive rule with a hidden constant must be inferred.";
    }
  }else{
    if(type===0){
      const k=ri(r,2,5),rows=Array.from({length:3},()=>{const a=ri(r,3,9),b=ri(r,2,7);return [a,b,a*b+k]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule=`in each row, third = (first × second) + ${k}`; reason="Requires identifying a two-operation multiplicative rule and the hidden constant.";
    }else if(type===1){
      const k=ri(r,2,5),rows=Array.from({length:3},()=>{const a=ri(r,5,11),b=ri(r,2,7);return [a,b,a*b-k]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule=`in each row, third = (first × second) − ${k}`; reason="Requires multiplication plus a second operation, with plausible simpler rules acting as distractors.";
    }else{
      const m=pick(r,[2,3]),rows=Array.from({length:3},()=>{const a=ri(r,2,8),b=ri(r,2,8);return [a,b,(a+b)*m]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule=`in each row, third = (first + second) × ${m}`; reason="Requires recognising operation order across two linked arithmetic steps.";
    }
  }
  if(!matrixIsClear(grid,ans))return genNumMatrix(seed+104729,band);

function genWordProblem(seed,difficulty="medium"){
  const r=rng(seed),band=requestedBand(difficulty),q=qbase(seed,"wordProblems",band); let ans,prompt,exp,reason;
  const type=ri(r,0,2);
  if(band==="easy"){
    if(type===0){
      const speed=pick(r,[12,15,20,24,25,30]),time=pick(r,[2,3,4,5]),dist=speed*time;ans=time;
      prompt=`A vehicle travels ${dist} kilometres at an average speed of ${speed} km/h. How many hours does the journey take?`;
      exp=`time = distance ÷ speed = ${dist} ÷ ${speed} = ${ans} hours.`;reason="One direct rate calculation with an integer result.";
    }else if(type===1){
      const total=pick(r,[80,120,160,200,240,320]),pct=pick(r,[10,25,50]);ans=total*pct/100;
      prompt=`A unit has ${total} items. ${pct}% are allocated for training. How many items is that?`;
      exp=`${pct}% of ${total} = ${ans}.`;reason="One-step percentage using a common mental-maths fraction (10%, 25% or 50%).";
    }else{
      const workers=pick(r,[3,4,5]),per=pick(r,[6,8,10]),hours=pick(r,[2,3]);ans=workers*per*hours;
      prompt=`${workers} people each process ${per} forms per hour. How many forms do they process altogether in ${hours} hours?`;
      exp=`${workers} × ${per} × ${hours} = ${ans}.`;reason="Straightforward multiplication with all required values stated directly.";
    }
  }else if(band==="medium"){
    if(type===0){
      const a=ri(r,2,6),b=ri(r,2,6),unit=ri(r,4,12),total=(a+b)*unit;ans=a*unit;
      prompt=`Red and blue markers are in the ratio ${a}:${b}. There are ${total} markers altogether. How many are red?`;
      exp=`Total ratio parts = ${a+b}. One part = ${unit}. Red = ${a} × ${unit} = ${ans}.`;reason="Requires converting a ratio into total parts before calculating the requested share.";
    }else if(type===1){
      const n=pick(r,[4,5,6]),avg=ri(r,12,25),sum=avg*n;let known=[];
      for(let i=0;i<n-1;i++)known.push(ri(r,8,28)); const knownSum=known.reduce((a,b)=>a+b,0);ans=sum-knownSum;
      if(ans<2||ans>45)return genWordProblem(seed+311,band);
      prompt=`The average of ${n} scores is ${avg}. ${n-1} scores are ${known.join(", ")}. What is the remaining score?`;
      exp=`Required total = ${avg} × ${n} = ${sum}. Known total = ${knownSum}. Missing = ${ans}.`;reason="Requires reversing an average: find the target total, then subtract several known values.";
    }else{
      const packs=ri(r,3,8),each=pick(r,[8,10,12,15]),pct=pick(r,[75,80,90]),total=packs*each;ans=total*pct/100;
      if(!Number.isInteger(ans))return genWordProblem(seed+613,band);
      prompt=`There are ${packs} packs with ${each} components in each pack. If ${pct}% pass inspection, how many components pass?`;
      exp=`Total = ${packs} × ${each} = ${total}. Then ${pct}% of ${total} = ${ans}.`;reason="A genuine two-stage problem: calculate the total first, then apply a less-trivial percentage.";
    }
  }else{
    if(type===0){
      const total=pick(r,[200,240,300,400]),reserved=pick(r,[20,25,30]),use=pick(r,[20,25,50]);const rem=total*(100-reserved)/100;ans=rem*use/100;
      if(!Number.isInteger(ans))return genWordProblem(seed+719,band);
      prompt=`A store holds ${total} items. ${reserved}% are reserved and cannot be used. Of the remaining items, ${use}% are issued. How many items are issued?`;
      exp=`Remaining = ${total} × ${100-reserved}% = ${rem}. Issued = ${use}% of ${rem} = ${ans}.`;reason="Two dependent percentage stages; the second percentage applies to a changed base, a common time-pressure trap.";
    }else if(type===1){
      const w1=ri(r,3,5),rate=pick(r,[6,8,10]),h1=pick(r,[2,3]),extra=ri(r,1,3),h2=1;ans=w1*rate*h1+(w1+extra)*rate*h2;
      prompt=`${w1} people process ${rate} forms each per hour for ${h1} hours. Then ${extra} more people join for 1 further hour at the same individual rate. How many forms are processed altogether?`;
      exp=`First stage: ${w1} × ${rate} × ${h1} = ${w1*rate*h1}. Second stage: ${w1+extra} × ${rate} = ${(w1+extra)*rate}. Total = ${ans}.`;reason="Requires calculating and combining two work-rate stages after the group size changes.";
    }else{
      const a=ri(r,2,5),b=ri(r,4,7),unit=pick(r,[6,8,10]),total=(a+b)*unit,move=pick(r,[2,3,4]);ans=a*unit+move;
      prompt=`Red and blue markers are in the ratio ${a}:${b}, with ${total} markers altogether. Then ${move} blue markers are moved into the red group. How many red markers are there now?`;
      exp=`Initially red = ${a}/${a+b} of ${total} = ${a*unit}. After moving ${move}, red = ${ans}.`;reason="Requires solving a ratio first, then correctly applying a second change to the result.";
    }
  }
  q.prompt=prompt;q.kind=band==="hard"?"numeric":"single";q.answer=ans;
  if(q.kind==="single")q.options=uniqOptions(ans,[ans+pick(r,[2,4,5,10]),ans-pick(r,[1,3,5]),ans*2],r);
  q.explanation=exp;return setDifficulty(q,band,reason);
}

function calibrateDifficulty(q){
  // Regression guard for the exact class of issue reported by the user: A,B,A,B,A,B is never Hard.
  if(q.subtype==="numSeries" && q.display?.type==="sequence"){
    const vals=q.display.values.filter(v=>v!=="?");
    if(vals.length>=5 && vals.every((v,i)=>v===vals[i%2])){
      q.difficulty="easy";
      q.difficultyReason="Simple two-value alternation (A, B, A, B...) — explicitly classified Easy.";
    }
  }
  return q;
}

const MENTAL_OPS={add:{label:"Addition",symbol:"+"},sub:{label:"Subtraction",symbol:"−"},mul:{label:"Multiplication",symbol:"×"},div:{label:"Division",symbol:"÷"}};

 <section class="card mental-card"><h3>3. Session length</h3><p class="section-copy">Choose a fixed number of questions or work continuously against the clock.</p><div class="mental-choice-row"><button class="mental-choice ${s.lengthMode==="questions"?"active":""}" onclick="setMentalLengthMode('questions')">Number of questions</button><button class="mental-choice ${s.lengthMode==="time"?"active":""}" onclick="setMentalLengthMode('time')">Timed session</button></div><div class="mental-setting-row" style="margin-top:12px">${s.lengthMode==="questions"?`<div class="field"><label>Questions</label><select onchange="state.mentalSetup.questionCount=+this.value">${[10,20,30,50,100].map(n=>`<option value="${n}" ${s.questionCount===n?"selected":""}>${n}</option>`).join("")}</select></div>`:`<div class="field"><label>Duration</label><select onchange="state.mentalSetup.durationSeconds=+this.value">${[[60,"1 minute"],[120,"2 minutes"],[180,"3 minutes"],[300,"5 minutes"],[600,"10 minutes"]].map(([n,l])=>`<option value="${n}" ${s.durationSeconds===n?"selected":""}>${l}</option>`).join("")}</select></div>`}</div><div class="mental-start"><button class="btn" onclick="startMentalMath()">Start Mental Math</button></div></section>
 </div>${state.mentalPickerOpen?renderMentalTablePicker():""}${state.mental?renderMentalSessionModal():""}</main>`;

function toggleMentalOp(op){const ops=state.mentalSetup.ops;state.mentalSetup.ops=ops.includes(op)?ops.filter(x=>x!==op):[...ops,op];if(!state.mentalSetup.ops.length)state.mentalSetup.ops=[op];render();}

function submitMentalAnswer(){const m=state.mental;if(!m||m.phase!=="questions")return;if(m.config.lengthMode==="time"&&mentalTimeLeft()<=0){finishMentalMath();return;}const raw=m.currentValue;if(raw===null||raw===undefined||String(raw).trim()==="")return;const value=Number(raw),elapsed=(Date.now()-m.qStart)/1000;m.answers.push(value);m.times.push(elapsed);m.currentValue="";if(m.config.lengthMode==="questions"){if(m.index>=m.questions.length-1){finishMentalMath();return;}m.index++;m.qStart=Date.now();render();focusMentalInput();return;}m.questions.push(generateMentalQuestion(m.r,m.config.ops,m.config.tables));m.index++;m.qStart=Date.now();render();startMentalTimer();focusMentalInput();}
function finishMentalMath(){const m=state.mental;if(!m||m.phase==="summary")return;clearInterval(m.interval);m.phase="summary";m.finishedAt=Date.now();m.elapsed=(m.finishedAt-m.started)/1000;render();}
function renderMentalSummary(){const m=state.mental,answered=m.answers.length,usedQuestions=m.questions.slice(0,answered),correct=usedQuestions.filter((q,i)=>Number(m.answers[i])===Number(q.answer)).length,avg=answered?m.times.reduce((a,b)=>a+b,0)/answered:0,incorrect=usedQuestions.map((q,i)=>({q,i,user:m.answers[i]})).filter(x=>Number(x.user)!==Number(x.q.answer));return `<div class="mental-summary"><div class="kicker">Mental Math complete</div><h2>${correct}/${answered} correct</h2><div class="practice-summary-grid"><div class="practice-summary-stat"><b>${answered?Math.round(correct/answered*100):0}%</b><span>Accuracy</span></div><div class="practice-summary-stat"><b>${formatPracticeSeconds(avg)}</b><span>Average time</span></div><div class="practice-summary-stat"><b>${answered}</b><span>Questions answered</span></div></div>${incorrect.length?`<button class="btn secondary" onclick="toggleMentalIncorrect()">${m.showIncorrect?"Hide":"Review"} incorrect (${incorrect.length})</button>${m.showIncorrect?`<div class="mental-review-list">${incorrect.map(x=>`<div class="mental-review-item"><div><div class="mental-review-problem">${x.q.prompt}</div><div class="mental-review-user">Your answer: ${x.user}</div></div><div class="smallnote">${formatPracticeSeconds(m.times[x.i])}</div><div class="mental-review-answer">Correct: ${x.q.answer}</div></div>`).join("")}</div>`:""}`:`<div class="notice blue">Perfect score — there are no incorrect questions to review.</div>`}<div style="margin-top:18px"><button class="btn" onclick="restartMentalMath()">Run another session</button></div></div>`;}
function toggleMentalIncorrect(){state.mental.showIncorrect=!state.mental.showIncorrect;render();}
function restartMentalMath(){state.mental=null;render();}
function closeMentalSummary(){state.mental=null;render();}
async function exitMentalMath(){const ok=await uiConfirm("Your answers and timing from this unfinished Mental Math session will be lost.","Exit Mental Math?","Exit",true);if(!ok)return;clearInterval(state.mental?.interval);state.mental=null;render();}

function strategyPage(){
 return `${currentPageNav()}<main class="container"><div class="section-head"><div><h2>JOA Strategy Guide</h2><p>Official advice first; training techniques second.</p></div></div>
 <section class="card" style="padding:22px"><h3>1. The pacing reality</h3><p>51 questions in 20 minutes is an average of about <b>23.5 seconds per question</b>. The official ADF guide says finishing all 51 is very rare and recommends answering the questions you feel confident about first, flagging difficult questions and returning later.</p>
 <div class="notice blue">Training rule: use ~10–15 seconds for immediately obvious items, and consider moving on around 30 seconds if you are still not making progress. The exact 30-second cap is a training heuristic, not an ADF rule.</div></section>
 <section class="grid3 section">
  <div class="card category-card"><h3>Numerical speed</h3><ul><li>Memorise common fraction/percent equivalents: 1/2=50%, 1/4=25%, 3/4=75%, 1/5=20%.</li><li>For rates, write D = S × T, then cover the variable you need.</li><li>For series, differences first; do not immediately reach for algebra.</li><li>Use rough estimation to eliminate impossible options.</li></ul></div>
  <div class="card category-card"><h3>Verbal speed</h3><ul><li>For analogies, form a one-line bridge sentence.</li><li>For proof questions, use only given facts — never background assumptions.</li><li>For odd-word sets, define the majority category before picking outsiders.</li><li>Read the instruction word: NOT, TWO, PROVE and ONLY change the task.</li></ul></div>
  <div class="card category-card"><h3>Abstract speed</h3><ul><li>Scan count → fill → position → rotation → symmetry.</li><li>Track one attribute at a time.</li><li>Test alternating patterns early.</li><li>Say the rule in words before selecting an odd figure.</li></ul></div>
 </section>
 <section class="card section" style="padding:22px"><h3>2. Test-day setup from the official guide</h3><ul style="line-height:1.75"><li>Use a laptop or desktop and a supported browser.</li><li>Be rested, comfortable and free of distractions.</li><li>Do not accept help from anyone.</li><li>Do not open the unique JOA link until you are ready to complete the assessment in full.</li><li>Use the practice period to learn the navigation and answer mechanics.</li></ul></section>
 <section class="card section" style="padding:22px"><h3>3. Calculator / paper caution</h3><p>Current independent JOA prep sources commonly advise practising without a calculator and some say pen and paper are permitted. The attached official ADF guide does not state a calculator/paper rule. This trainer therefore assumes <b>mental arithmetic first</b> but does not present calculator policy as an official fact. Follow the instructions shown in your actual assessment.</p></section>
 </main>`;
}
function sourcesPage(){
 return `${currentPageNav()}<main class="container"><div class="section-head"><div><h2>Sources & Fidelity</h2><p>What is official, what is secondary, and what this simulator deliberately does not claim.</p></div></div>
 <div class="sources">
  <div class="card source-card"><h3><span class="badge official">Primary / official</span> ADF-RECREF132 — A Guide to the Job Opportunities Assessment for the Australian Defence Force</h3><p>Revised 27 June 2025. Used as the controlling source for timing, 51-item length, 10-minute / 5-question familiarisation, numerical-verbal-abstract families, flagging/navigation advice and the high-fidelity example styles (number matrix, dot odd-one-out, two-statement verbal proof, block odd-one-out, number sequence and speed-distance word problem).</p></div>
  <div class="card source-card"><h3><span class="badge official">Primary / official</span> ADF Careers — Application Process</h3><p>Used to verify that the JOA is an early application step intended to help determine suitable services and positions, and to separate the JOA from the later YOU Session.</p></div>
  <div class="card source-card"><h3><span class="badge medium">Secondary</span> Current Australian-focused JOA preparation providers</h3><p>ADFTestPrep.com, Army-Test / Seliant, ADF Mentors, OpenExamPrep and the Institute of Psychometric Coaching were checked for current JOA-specific descriptions. They broadly support numerical/verbal/abstract preparation and add likely subtypes such as word analogies, synonyms/antonyms, number series/matrices, odd-word classification and visual sequences. Where secondary sources conflict with the revised official guide (for example older 'game-based mini-test' descriptions), this trainer follows the official guide.</p></div>
  <div class="card source-card"><h3><span class="badge medium">Anecdotal only</span> Reddit — AustralianMilitary / ADFRecruiting</h3><p>Used only for broad experience signals: candidates repeatedly describe intense time pressure, strategic skipping/flagging and value in becoming familiar with the format. No recalled or restricted live-test questions were copied. Current ADFRecruiting moderation also explicitly prohibits sharing specific JOA assessment content, so this tool stays with independently generated practice material.</p></div>
 </div>
 <section class="section"><h2>Question-family fidelity map</h2><table class="fidelity-table"><thead><tr><th>Training module</th><th>Fidelity</th><th>Why</th></tr></thead><tbody>
 ${Object.entries(SUBTYPES).map(([k,v])=>`<tr><td>${v.cat} — ${v.name}</td><td><span class="badge ${v.fidelity.toLowerCase()}">${v.fidelity}</span></td><td>${v.basis}</td></tr>`).join("")}
 </tbody></table></section>
 <section class="card section" style="padding:20px"><h3>Question-bank QA</h3><p>This build uses a finite category-practice bank of <b>1,320 questions</b> (40 per difficulty band for each question subtype) plus 18 fixed 51-question mocks. The full bank is exhaustively machine-checked before release for answer presence, selection counts, arithmetic consistency, matrix-rule ambiguity, correct-vs-incorrect visual distinguishability, clipping, reference/starting figures only where the prompt genuinely requires one, and deterministic regeneration. Semantic verbal templates are also manually reviewed. New completed full-test attempts save an exact snapshot of their 51 questions so later bank updates cannot change an old answer review.</p></section><section class="card section" style="padding:20px"><h3>Difficulty calibration</h3><p>Easy / Medium / Hard badges are now assigned by the <b>actual construction of each generated item</b>. Easy is reserved for one-rule or immediately classifiable items; Medium requires an additional inference, second attribute or two-step process; Hard is reserved for interleaved rules, dependent multi-step calculations, close logic traps, reflection-vs-rotation discrimination or similarly layered reasoning. A regression guard explicitly classifies simple A-B-A-B number alternation as Easy.</p></section><section class="card section" style="padding:20px"><h3>What this tool does not claim</h3><p>It does not claim to reproduce proprietary JOA questions, exact scoring, role cut-scores, adaptive behaviour, official item difficulty labels or an unpublished official section split. “Same difficulty as JOA” is therefore a best-match simulation tier based on the official public examples and current Australian JOA-focused descriptions, not an ADF-issued difficulty rating.</p></section>
 </main>`;
}
function render(){
 const app=document.getElementById("app");
 if(state.page==="home")app.innerHTML=home();
 else if(state.page==="practice")app.innerHTML=practicePage();
 else if(state.page==="mental")app.innerHTML=mentalPage();
 else if(state.page==="mocks")app.innerHTML=mocksPage();
 else if(state.page==="test")app.innerHTML=testPage();
 else if(state.page==="results")app.innerHTML=resultsPage();
 else if(state.page==="progress")app.innerHTML=progressPage();
 else if(state.page==="strategy")app.innerHTML=strategyPage();
 else if(state.page==="sources")app.innerHTML=sourcesPage();
 document.body.classList.toggle("drill-open",(state.page==="practice"&&!!state.practice)||(state.page==="mental"&&!!state.mental));
}
render();
</script>
