function fullTestSubtypeSchedule(cat,id,r){
 const sts=byCat[cat],out=[];
 if(cat==="Numerical"){
   const counts={numSeries:4,numValue:3,wordProblems:6,numMatrix:4};
   Object.entries(counts).forEach(([st,n])=>{for(let i=0;i<n;i++)out.push(st)});
 }else{
   const base=Math.floor(17/sts.length),extra=17-base*sts.length;
   sts.forEach(st=>{for(let i=0;i<base;i++)out.push(st)});
   for(let i=0;i<extra;i++)out.push(sts[(id-1+i)%sts.length]);
 }
 return shuffle(r,out);
}
function fullTestCoverageSummary(qs){
 const subtypes=[...new Set(qs.map(q=>q.subtype))],word=qs.filter(q=>q.subtype==="wordProblems"),wordFamilies=word.map(questionFamily),groups={};
 const wordBandCounts={easy:0,medium:0,hard:0};word.forEach(q=>wordBandCounts[q.difficulty]=(wordBandCounts[q.difficulty]||0)+1);
 for(const g of FULL_TEST_WORD_GROUPS){groups[g.id]=word.some(q=>Object.values(g.byBand).flat().includes(questionFamily(q)))}
 return {subtypes,wordFamilies,groups,wordBandCounts,counts:{numSeries:qs.filter(q=>q.subtype==="numSeries").length,numValue:qs.filter(q=>q.subtype==="numValue").length,wordProblems:word.length,numMatrix:qs.filter(q=>q.subtype==="numMatrix").length}};
}
function validateFullTestCoverage(qs,id){
 if(qs.length!==51||uniqueQuestionCount(qs)!==51)throw new Error(`Practice Test ${id}: 51-question uniqueness guard failed`);
 for(const cat of ["Numerical","Verbal","Abstract"])if(qs.filter(q=>q.category===cat).length!==17)throw new Error(`Practice Test ${id}: ${cat} is not 17 questions`);
 for(const st of PRACTICE_BANK_SUBTYPES)if(!qs.some(q=>q.subtype===st))throw new Error(`Practice Test ${id}: missing subtype ${st}`);
 const s=fullTestCoverageSummary(qs),expected={numSeries:4,numValue:3,wordProblems:6,numMatrix:4};
 for(const [k,v] of Object.entries(expected))if(s.counts[k]!==v)throw new Error(`Practice Test ${id}: ${k} count ${s.counts[k]} != ${v}`);
 for(const [g,ok] of Object.entries(s.groups))if(!ok)throw new Error(`Practice Test ${id}: missing required Word Problem domain ${g}`);
 return s;
}

function normaliseSurfaceText(value){
 const namesPattern=new RegExp(`\\b(${names.join("|")})\\b`,"gi");
 return String(value??"")
   .replace(/<[^>]*>/g," ")
   .replace(namesPattern,"{name}")
   .replace(/\\b\\d+(?:\\.\\d+)?\\b/g,"#")
   .replace(/\\s+/g," ")
   .trim().toLowerCase();
}
function questionSurfaceSimilarityKey(q){
 const pieces=[q.subtype,questionFamily(q),normaliseSurfaceText(q.prompt)];
 if(Array.isArray(q.options))pieces.push(q.options.map(normaliseSurfaceText).join("|"));
 if(q.display?.type==="comparisonRows")pieces.push(q.display.rows.map(x=>normaliseSurfaceText(`${x.left}|${x.right}`)).join("||"));
 else if(q.display?.type==="series")pieces.push("series-pattern");
 else if(q.display?.type==="matrix")pieces.push("matrix-pattern");
 else if(q.display)pieces.push(JSON.stringify(stableCanonical(q.display)).replace(/\\d+(?:\\.\\d+)?/g,"#"));
 if(Array.isArray(q.visualOptions))pieces.push(q.visualOptions.map(visualAppearanceKey).join("|"));
 return pieces.join("§");
}

const mockCandidateCache=new Map();
function expandedMockCandidates(st,band,variation=0,testId=0){
 const cacheKey=`${testId}|${variation}|${st}|${band}`;
 if(mockCandidateCache.has(cacheKey))return mockCandidateCache.get(cacheKey);
 const extras=[];
 // Full tests use a test/attempt-specific candidate lane rather than
 // repeatedly drawing the same first 80 finite-bank slots.
 const laneSeed=17000011 + testId*10000019 + variation*20000033;
 for(let i=0;i<180;i++){
   const seed=practiceBankSeed(st,band,i%PRACTICE_BANK_SIZE_PER_DIFFICULTY)+laneSeed+i*3571;
   extras.push(generate(st,seed,band));
 }
 const base=bankCandidates(st,band),seen=new Set(),out=[];
 for(const q of [...extras,...base]){
   const fp=questionFingerprint(q);if(seen.has(fp))continue;
   seen.add(fp);out.push(q);
 }
 mockCandidateCache.set(cacheKey,out);
 return out;
}
function pickMockQuestion({st,band,requiredFamilies,globalSeen,currentNearCounts,historicalExact,historicalNear,familyCounts,lastFamily,seed,slot,variation,testId}){
 let candidates=expandedMockCandidates(st,band,variation,testId)
   .filter(q=>!globalSeen.has(questionFingerprint(q)))
   .filter(q=>visualOptionsDistinctByAppearance(q)&&relationalVisualEvidenceValid(q)&&nestedEdgeEvidenceValid(q));
 if(requiredFamilies?.length)candidates=candidates.filter(q=>requiredFamilies.includes(questionFamily(q)));
 if(!candidates.length)return null;

 // Exact prior questions are a hard exclusion whenever a fresh candidate exists.
 const fresh=candidates.filter(q=>!historicalExact.has(questionFingerprint(q)));
 if(fresh.length)candidates=fresh;

 candidates.sort((a,b)=>{
   const fa=questionFamily(a),fb=questionFamily(b),na=questionSurfaceSimilarityKey(a),nb=questionSurfaceSimilarityKey(b);
   const score=q=>{
     const fp=questionFingerprint(q),near=questionSurfaceSimilarityKey(q),fam=questionFamily(q);
     return (historicalExact.has(fp)?100000:0)
       +(historicalNear.has(near)?2500:0)
       +(currentNearCounts.get(near)||0)*800
       +(familyCounts.get(fam)||0)*80
       +(fam===lastFamily?25:0);
   };
   const sa=score(a),sb=score(b);if(sa!==sb)return sa-sb;
   return questionFingerprint(a)<questionFingerprint(b)?-1:1;
 });
 return candidates[(seed+slot*1009+variation*811+st.charCodeAt(0)*997)%Math.min(candidates.length,12)];
}
function buildMock(id,{variation=0,avoidQuestions=[]}={}){
 const m=mocks.find(x=>x.id===Number(id));if(!m)throw new Error("Unknown practice test");
 const seed=m.seed+variation*15485863,r=rng(seed),qs=[],globalSeen=new Set(),familyCounts=new Map(),currentNearCounts=new Map();
 const historicalExact=new Set(avoidQuestions.map(questionFingerprint));
 const historicalNear=new Set(avoidQuestions.map(questionSurfaceSimilarityKey));

 for(const cat of ["Numerical","Verbal","Abstract"]){
   const plan=difficultyPlan(m.tier,r),schedule=fullTestSubtypeSchedule(cat,id,r);let lastFamily=null,wordSlot=0;
   for(let i=0;i<17;i++){
     const st=schedule[i];let band=plan[i],requiredFamilies=null;
     if(st==="wordProblems"){
       const group=FULL_TEST_WORD_GROUPS[wordSlot++];band=fullTestWordBand(m.tier);requiredFamilies=fullTestWordFamilies(group,band);
     }
     const picked=pickMockQuestion({st,band,requiredFamilies,globalSeen,currentNearCounts,historicalExact,historicalNear,familyCounts,lastFamily,seed,slot:qs.length,variation,testId:id});
     if(!picked)throw new Error(`Practice Test ${id}: no valid ${st}/${band} question for required family ${requiredFamilies||"any"}`);
     qs.push(picked);
     const fp=questionFingerprint(picked),fam=questionFamily(picked),near=questionSurfaceSimilarityKey(picked);
     globalSeen.add(fp);familyCounts.set(fam,(familyCounts.get(fam)||0)+1);currentNearCounts.set(near,(currentNearCounts.get(near)||0)+1);lastFamily=fam;
   }
 }
 const out=shuffle(r,qs).map((q,i)=>({...q,testNo:i+1}));
 validateFullTestCoverage(out,id);return out;
}

 if(q.kind==="multi"){let a=t.answers[t.index]||[],val=q.options[i];a=a.includes(val)?a.filter(x=>x!==val):a.length<(q.maxSelect||2)?[...a,val]:a;t.answers[t.index]=a}
 else if(q.kind==="visualMulti"){let a=t.answers[t.index]||[];a=a.includes(i)?a.filter(x=>x!==i):a.length<(q.maxSelect||2)?[...a,i]:a;t.answers[t.index]=a}
 else t.answers[t.index]=(q.kind==="single"?q.options[i]:i);
 render();startTimer();
}
function recordCurrentTestQuestionTime(){
 const t=state.test;if(!t||!Array.isArray(t.questionTimes))return;const now=Date.now();if(t.qEnteredAt)t.questionTimes[t.index]+=(now-t.qEnteredAt)/1000;t.qEnteredAt=now;
}
function enterTestQuestion(i){const t=state.test;if(!t)return;recordCurrentTestQuestionTime();t.index=i;t.qEnteredAt=Date.now();render();startTimer()}
function jumpQ(i){if(i!==state.test.index)enterTestQuestion(i)}
function prevQ(){if(state.test.index>0)enterTestQuestion(state.test.index-1)}
function nextQ(){if(state.test.index<state.test.questions.length-1)enterTestQuestion(state.test.index+1);else confirmSubmit()}
function toggleFlag(){state.test.flags[state.test.index]=!state.test.flags[state.test.index];render();startTimer()}
async function exitTest(){
 const t=state.test;if(!t)return;recordCurrentTestQuestionTime();const label=t.warmup?"familiarisation":"practice test";
 const ok=await uiConfirm(`Your answers and progress in this unfinished ${label} will be lost.`,"Exit test?","Exit",true);if(!ok)return;

async function confirmSubmit(){

 const message=un?`${un} question${un===1?" is":"s are"} unanswered. Submit the test now?`:"Submit this test now?";

function calculateBreakdown(questions,answers){
 const by={};questions.forEach((q,i)=>{by[q.category]??={total:0,correct:0,attempted:0};const a=answers[i],attempted=a!==null&&a!==undefined&&(!Array.isArray(a)||a.length>0);by[q.category].total++;by[q.category].correct+=isCorrect(q,a)?1:0;by[q.category].attempted+=attempted?1:0;});return by;
}
function submitTest(auto){
 const t=state.test;if(!t||t.submitted)return;recordCurrentTestQuestionTime();t.submitted=true;clearInterval(t.interval);
 const correct=t.questions.filter((q,i)=>isCorrect(q,t.answers[i])).length,attempted=t.answers.filter(x=>x!==null&&x!==undefined&&(!Array.isArray(x)||x.length>0)).length,elapsed=Math.min(t.duration,Math.floor((Date.now()-t.started)/1000)),by=calculateBreakdown(t.questions,t.answers),questionTimes=Array.isArray(t.questionTimes)?t.questionTimes.map(x=>Math.max(0,Number(x)||0)):Array(t.questions.length).fill(null);
 state.review={id:t.id,tier:t.tier,questions:t.questions,answers:t.answers,flags:t.flags,questionTimes,reviewOpen:false,reviewIndex:0,accuracyMode:"total",correct,attempted,by,auto,warmup:t.warmup,elapsed,date:new Date().toISOString()};
 if(!t.warmup){const attemptId=`${Date.now()}-${Math.floor(Math.random()*1000000)}`;progress.attempts.unshift({attemptId,testId:t.id,tier:t.tier,date:state.review.date,elapsed,correct,attempted,answers:t.answers,flags:t.flags,questionTimes,auto:!!auto,questionBankVersion:QUESTION_BANK_VERSION,variation:t.variation??null,questions:t.questions});saveProgress();state.review.savedAttemptId=attemptId;}

}

function reviewAnswerState(r,i){const a=r.answers[i],unanswered=a===null||a===undefined||(Array.isArray(a)&&a.length===0);if(unanswered)return "unanswered";return isCorrect(r.questions[i],a)?"correct":"incorrect"}

function activeMentalTables(){const s=state.mentalSetup;if(s.tableMode==="single")return [s.singleTable];if(s.tableMode==="custom")return s.selectedTables.length?[...s.selectedTables]:Array.from({length:12},(_,i)=>i+1);return Array.from({length:12},(_,i)=>i+1);}
function mentalFactKey(q){
 if(!q)return "";
 if(q.op==="mul"||q.op==="div"){
   const f=[Number(q.factorA),Number(q.factorB)].sort((a,b)=>a-b);return `muldiv|${f[0]}|${f[1]}`;
 }
 if(q.op==="add"||q.op==="sub"){
   const f=[Number(q.factorA),Number(q.factorB)].sort((a,b)=>a-b);return `addsub|${f[0]}|${f[1]}`;
 }
 return q.prompt;
}
function generateMentalQuestion(r,ops,tables,selectedFactorsOnly=false){
 const op=pick(r,ops);
 if(op==="add"){
   const a=ri(r,1,12),b=ri(r,1,12);return {op,factorA:a,factorB:b,prompt:`${a} + ${b}`,answer:a+b};
 }
 if(op==="sub"){
   const a=ri(r,1,12),b=ri(r,1,12),total=a+b;return {op,factorA:a,factorB:b,prompt:`${total} − ${a}`,answer:b};
 }
 if(op==="mul"){
   const a=pick(r,tables),b=selectedFactorsOnly?pick(r,tables):ri(r,1,12);return {op,factorA:a,factorB:b,prompt:`${a} × ${b}`,answer:a*b};
 }
 const divisor=pick(r,tables),quotient=selectedFactorsOnly?pick(r,tables):ri(r,1,12);
 return {op,factorA:divisor,factorB:quotient,prompt:`${divisor*quotient} ÷ ${divisor}`,answer:quotient};
}
function generateMentalQuestionAvoiding(r,ops,tables,selectedFactorsOnly,previous){
 let q=null;
 for(let attempt=0;attempt<40;attempt++){
   q=generateMentalQuestion(r,ops,tables,selectedFactorsOnly);
   if(!previous||mentalFactKey(q)!==mentalFactKey(previous))return q;
 }
 return q;
}
function startMentalMath(){
 const s=state.mentalSetup,seed=(Date.now()>>>0)^Math.floor(Math.random()*0xffffffff),r=rng(seed);
 const config={ops:[...s.ops],tables:activeMentalTables(),selectedFactorsOnly:s.tableMode==="custom"&&!!s.selectedFactorsOnly,lengthMode:s.lengthMode,questionCount:s.questionCount,durationSeconds:s.durationSeconds};
 const qs=[];
 if(config.lengthMode==="questions"){
   for(let i=0;i<config.questionCount;i++)qs.push(generateMentalQuestionAvoiding(r,config.ops,config.tables,config.selectedFactorsOnly,qs.at(-1)));
 }else qs.push(generateMentalQuestionAvoiding(r,config.ops,config.tables,config.selectedFactorsOnly,null));
 state.mental={phase:"questions",config,r,questions:qs,answers:[],times:[],index:0,currentValue:"",started:Date.now(),qStart:Date.now(),endAt:config.lengthMode==="time"?Date.now()+config.durationSeconds*1000:null,interval:null,showIncorrect:false};render();bindMentalKeypad();if(config.lengthMode==="time")startMentalTimer();focusMentalInput();
}
function renderMentalSessionModal(){const m=state.mental;return `<div class="drill-modal" role="dialog" aria-modal="true" aria-label="Mental Math session"><div class="drill-dialog"><div class="drill-modal-head"><div><strong>Mental Math</strong><div class="smallnote">${m.phase==="summary"?"Session complete":MENTAL_OPS[m.questions[m.index]?.op]?.label||"Practice"}</div></div><button class="drill-close" onclick="${m.phase==="summary"?"closeMentalSummary()":"exitMentalMath()"}">${m.phase==="summary"?"Close":"Exit"}</button></div>${m.phase==="summary"?renderMentalSummary():renderMentalQuestion()}</div></div>`;}
function mentalTimeLeft(){if(!state.mental?.endAt)return 0;return Math.max(0,Math.ceil((state.mental.endAt-Date.now())/1000));}
function formatClockSeconds(seconds){const s=Math.max(0,Math.ceil(seconds));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;}
function renderMentalQuestion(){
 const m=state.mental,q=m.questions[m.index],timed=m.config.lengthMode==="time",progressText=timed?`Answered ${m.answers.length}`:`Question ${m.index+1} of ${m.questions.length}`;
 const touchValue=String(m.currentValue||"");
 return `<div class="mental-session-card">
   <div class="mental-session-top"><div class="mental-session-progress">${progressText}</div>${timed?`<div id="mentalCountdown" class="mental-countdown">${formatClockSeconds(mentalTimeLeft())}</div>`:""}</div>
   <div class="mental-problem">${q.prompt}</div>
   <div class="mental-desktop-entry">
    <div class="mental-answer-row"><input id="mentalAnswer" class="mental-answer" inputmode="numeric" type="number" step="1" autocomplete="off" value="${m.currentValue||""}" oninput="state.mental.currentValue=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();submitMentalAnswer()}"><button class="btn" onclick="submitMentalAnswer()">Next</button></div>
    <div class="smallnote" style="text-align:center;margin-top:10px">Answer mentally, type the result, then press Enter or Next.</div>
   </div>
   <div class="mental-touch-entry">
    <div class="mental-touch-display">${touchValue}</div>
    <div class="mental-keypad" aria-label="Mental Math number pad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="mental-key" role="button" data-mental-key="${n}"><span class="mental-key-face">${n}</span></div>`).join("")}
      <div class="mental-key utility" role="button" data-mental-key="back"><span class="mental-key-face">⌫</span></div>
      <div class="mental-key" role="button" data-mental-key="0"><span class="mental-key-face">0</span></div>
      <div class="mental-key utility" role="button" data-mental-key="clear"><span class="mental-key-face">Clear</span></div>
      <div class="mental-key enter" role="button" data-mental-key="enter"><span class="mental-key-face">Enter</span></div>
    </div>
   </div>
  </div>`;
}
function refreshMentalTouchDisplay(){const el=document.querySelector(".mental-touch-display");if(el)el.textContent=String(state.mental?.currentValue||"");}
function mentalKey(digit){if(!state.mental)return;const cur=String(state.mental.currentValue||"");if(cur.length>=6)return;state.mental.currentValue=cur+digit;refreshMentalTouchDisplay();}
function mentalBackspace(){if(!state.mental)return;state.mental.currentValue=String(state.mental.currentValue||"").slice(0,-1);refreshMentalTouchDisplay();}
function mentalClear(){if(!state.mental)return;state.mental.currentValue="";refreshMentalTouchDisplay();}
function mentalPadAction(action){
 if(action==="enter"){submitMentalAnswer();return;}
 if(action==="back"){mentalBackspace();return;}
 if(action==="clear"){mentalClear();return;}
 if(/^\d$/.test(action))mentalKey(action);
}
function flashMentalKey(key){
 if(!key)return;
 key.classList.add("mental-key-flash");
 setTimeout(()=>key.classList.remove("mental-key-flash"),55);
}
function bindMentalKeypad(){
 const pad=document.querySelector(".mental-keypad");
 if(!pad||pad.dataset.bound==="1")return;
 pad.dataset.bound="1";

 // iPhone/iPad: capture the input on touchstart itself.
 pad.addEventListener("touchstart",event=>{
   const key=event.target.closest("[data-mental-key]");
   if(!key||!pad.contains(key))return;
   event.preventDefault();
   event.stopPropagation();
   flashMentalKey(key);
   mentalPadAction(key.dataset.mentalKey);
 },{passive:false,capture:true});

 // Mouse / trackpad / Apple Pencil fallback. Touch pointers are ignored
 // because touchstart above has already handled them.
 pad.addEventListener("pointerdown",event=>{
   if(event.pointerType==="touch")return;
   const key=event.target.closest("[data-mental-key]");
   if(!key||!pad.contains(key))return;
   event.preventDefault();
   flashMentalKey(key);
   mentalPadAction(key.dataset.mentalKey);
 },{passive:false,capture:true});
}
function focusMentalInput(){setTimeout(()=>document.getElementById("mentalAnswer")?.focus(),30);}
function startMentalTimer(){clearInterval(state.mental?.interval);if(!state.mental)return;state.mental.interval=setInterval(()=>{if(!state.mental||state.mental.phase!=="questions")return;const left=mentalTimeLeft(),el=document.getElementById("mentalCountdown");if(el)el.textContent=formatClockSeconds(left);if(left<=0)finishMentalMath();},200);}
function updateMentalQuestionDom(){
 const m=state.mental;if(!m||m.phase!=="questions")return;
 const q=m.questions[m.index],timed=m.config.lengthMode==="time";
 const problem=document.querySelector(".mental-problem");
 const progressEl=document.querySelector(".mental-session-progress");
 const subtitle=document.querySelector(".drill-modal-head .smallnote");
 const input=document.getElementById("mentalAnswer");
 if(problem)problem.textContent=q.prompt;
 if(progressEl)progressEl.textContent=timed?`Answered ${m.answers.length}`:`Question ${m.index+1} of ${m.questions.length}`;
 if(subtitle)subtitle.textContent=MENTAL_OPS[q.op]?.label||"Practice";
 if(input)input.value="";
 refreshMentalTouchDisplay();
}
function submitMentalAnswer(){
 const m=state.mental;if(!m||m.phase!=="questions")return;
 if(m.config.lengthMode==="time"&&mentalTimeLeft()<=0){finishMentalMath();return;}
 const raw=m.currentValue;
 if(raw===null||raw===undefined||String(raw).trim()==="")return;

 const value=Number(raw),elapsed=(Date.now()-m.qStart)/1000;
 m.answers.push(value);m.times.push(elapsed);m.currentValue="";

 if(m.config.lengthMode==="questions"){
   if(m.index>=m.questions.length-1){finishMentalMath();return;}
   m.index++;
 }else{
   m.questions.push(generateMentalQuestionAvoiding(m.r,m.config.ops,m.config.tables,m.config.selectedFactorsOnly,m.questions.at(-1)));
   m.index++;
 }

 // Update only the small pieces that changed. The keypad itself is never
 // destroyed/recreated between questions, so a very fast next tap is retained.
 updateMentalQuestionDom();
 m.qStart=Date.now();
 const input=document.getElementById("mentalAnswer");if(input)input.focus();
}
function finishMentalMath(){const m=state.mental;if(!m||m.phase==="summary")return;clearInterval(m.interval);m.phase="summary";m.finishedAt=Date.now();m.elapsed=(m.finishedAt-m.started)/1000;render();}
function renderMentalSummary(){const m=state.mental,answered=m.answers.length,usedQuestions=m.questions.slice(0,answered),correct=usedQuestions.filter((q,i)=>Number(m.answers[i])===Number(q.answer)).length,avg=answered?m.times.reduce((a,b)=>a+b,0)/answered:0,incorrect=usedQuestions.map((q,i)=>({q,i,user:m.answers[i]})).filter(x=>Number(x.user)!==Number(x.q.answer));return `<div class="mental-summary"><div class="kicker">Mental Math complete</div><h2>${correct}/${answered} correct</h2><div class="practice-summary-grid"><div class="practice-summary-stat"><b>${answered?Math.round(correct/answered*100):0}%</b><span>Accuracy</span></div><div class="practice-summary-stat"><b>${formatPracticeSeconds(avg)}</b><span>Average time</span></div><div class="practice-summary-stat"><b>${answered}</b><span>Questions answered</span></div></div>${incorrect.length?`<button class="btn secondary" onclick="toggleMentalIncorrect()">${m.showIncorrect?"Hide":"Review"} incorrect (${incorrect.length})</button>${m.showIncorrect?`<div class="mental-review-list">${incorrect.map(x=>`<div class="mental-review-item"><div><div class="mental-review-problem">${x.q.prompt}</div><div class="mental-review-user">Your answer: ${x.user}</div></div><div class="smallnote">${formatPracticeSeconds(m.times[x.i])}</div><div class="mental-review-answer">Correct: ${x.q.answer}</div></div>`).join("")}</div>`:""}`:`<div class="notice blue">Perfect score — there are no incorrect questions to review.</div>`}<div style="margin-top:18px"><button class="btn" onclick="restartMentalMath()">Run another session</button></div></div>`;}
function toggleMentalIncorrect(){state.mental.showIncorrect=!state.mental.showIncorrect;render();}
function restartMentalMath(){state.mental=null;render();}
function closeMentalSummary(){state.mental=null;render();}
async function exitMentalMath(){const ok=await uiConfirm("Your answers and timing from this unfinished Mental Math session will be lost.","Exit Mental Math?","Exit",true);if(!ok)return;clearInterval(state.mental?.interval);state.mental=null;render();}

function strategyPage(){
 return `${currentPageNav()}<main class="container"><div class="section-head"><div><h2>JOA Strategy Guide</h2><p>Official advice first; training techniques second.</p></div></div>
 <section class="card" style="padding:22px"><h3>1. The pacing reality</h3><p>51 questions in 20 minutes is an average of about <b>23.5 seconds per question</b>. The official ADF guide says finishing all 51 is very rare and recommends answering the questions you feel confident about first, flagging difficult questions and returning later.</p>
 <div class="notice blue">Training rule: use ~10–15 seconds for immediately obvious items, and consider moving on around 30 seconds if you are still not making progress. The exact 30-second cap is a training heuristic, not an ADF rule.</div></section>
 <section class="grid3 section">
  <div class="card category-card"><h3>Numerical speed</h3><ul><li>Memorise common fraction/decimal/percent equivalents: 1/2=.5=50%, 1/3≈.333, 1/4=.25, 1/5=.2.</li><li>For Number Value, compare place value or cross-multiply close fractions instead of doing long division.</li><li>For rates, write D = S × T; for work, output = people × rate × time.</li><li>For series, write the increments if the first rule is not obvious — the increments may contain the pattern.</li><li>For combinations, multiply independent choice counts and remember an optional 'none' can be another choice.</li></ul></div>
  <div class="card category-card"><h3>Verbal speed</h3><ul><li>For analogies, define the relationship in a one-line bridge sentence <b>before</b> studying the answers, then preserve its direction.</li><li>For logic, use only the given facts. Simple circles/sets help with all/some/no; never assume the converse.</li><li>For seating, draw slots and place the easiest fixed clue first. For family trees, draw each relationship as you read.</li><li>For accuracy/precision, compare one row at a time and actively check punctuation, case, transpositions and lookalike characters.</li><li>Vocabulary is less systematic: eliminate quickly and avoid sacrificing too much time to one unknown word.</li></ul></div>
  <div class="card category-card"><h3>Abstract speed</h3><ul><li>For picture series, isolate one object/attribute at a time and track its movement before looking deeply at answers.</li><li>For matrices, test rows and columns first; also consider one-of-each inventories and two-cells-combine rules.</li><li>For analogies, identify the first-pair transformation and apply the same change in the same direction.</li><li>For odd-one-out, inspect count, shape type, edges, fill, line direction/thickness, symmetry and parallel edges.</li><li>Use elimination after each confirmed rule rather than waiting to solve every feature at once.</li></ul></div>
 </section>
 <section class="card section" style="padding:22px"><h3>Secondary-source training insight — ADF Mentors</h3><p>The user-supplied ADF Mentors module reinforces a practical split between <b>systematic</b> question types (series, matrices, analogies, logic, seating/family relationships, accuracy checking) and vocabulary-heavy items. Its strongest recurring advice is to externalise the pattern: write increments for number series, use slot/table sketches for ordering, draw family trees and simple set circles, and isolate one visual feature at a time. It also recommends reviewing missed questions after a simulation and repeating the same practice test after roughly <b>2–3 days</b> to see whether the method has improved. This trainer uses those ideas as <b>training techniques</b>, not as official ADF instructions.</p></section>
 <section class="card section" style="padding:22px"><h3>2. Test-day setup from the official guide</h3><ul style="line-height:1.75"><li>Use a laptop or desktop and a supported browser.</li><li>Be rested, comfortable and free of distractions.</li><li>Do not accept help from anyone.</li><li>Do not open the unique JOA link until you are ready to complete the assessment in full.</li><li>Use the practice period to learn the navigation and answer mechanics.</li></ul></section>
 <section class="card section" style="padding:22px"><h3>3. Calculator / paper caution</h3><p>Current independent JOA prep sources commonly advise practising without a calculator and some say pen and paper are permitted. The attached official ADF guide does not state a calculator/paper rule. This trainer therefore assumes <b>mental arithmetic first</b> but does not present calculator policy as an official fact. Follow the instructions shown in your actual assessment.</p></section>
 </main>`;
}
function sourcesPage(){
 return `${currentPageNav()}<main class="container"><div class="section-head"><div><h2>Sources & Fidelity</h2><p>What is official, what is secondary, and what this simulator deliberately does not claim.</p></div></div>
 <div class="sources">
  <div class="card source-card"><h3><span class="badge official">Primary / official</span> ADF-RECREF132 — A Guide to the Job Opportunities Assessment for the Australian Defence Force</h3><p>Revised 27 June 2025. Used as the controlling source for timing, 51-item length, 10-minute / 5-question familiarisation, numerical-verbal-abstract families, flagging/navigation advice and the high-fidelity example styles (number matrix, dot odd-one-out, two-statement verbal proof, block odd-one-out, number sequence and speed-distance word problem).</p></div>
  <div class="card source-card"><h3><span class="badge official">Primary / official</span> ADF Careers — Application Process</h3><p>Used to verify that the JOA is an early application step intended to help determine suitable services and positions, and to separate the JOA from the later YOU Session.</p></div>
  <div class="card source-card"><h3><span class="badge medium">Secondary — detailed capture</span> ADF Mentors — JOA Online Test training module</h3><p>A user-supplied set of 30 screenshots was reviewed page by page for v1.11. It documents four Numerical styles (Number Series, Number Value, Word Problems, Matrix Completion), a broader Verbal taxonomy (general vocabulary, sentence completion, odd-one-out, accuracy/precision, analogies, logical reasoning, seating arrangements and family trees), and four Abstract styles (Picture Series, Matrices, Analogies and Odd One Out). It also supplies practical techniques such as writing number increments, fraction/decimal comparison, D/S/T and reverse-percentage thinking, analogy bridge sentences, Venn/set sketches, slot diagrams, family-tree drawing, exact-text comparison and feature-by-feature visual elimination. Its simulation material separately describes some tests as representative of the real level and later tests as deliberately harder; that is useful secondary support for this trainer's JOA-level / harder practice tiers, but is <b>not</b> an official ADF difficulty rating. A historical page in the capture also describes a 51-question / 20-minute online test across Numerical, Verbal and Abstract reasoning; the current 2025 official ADF guide remains the authority for those format facts. These screenshots are treated as reputable secondary-source signals — never as overriding the official ADF guide.</p></div>
  <div class="card source-card"><h3><span class="badge medium">Secondary</span> Other Australian-focused JOA preparation providers</h3><p>ADFTestPrep.com, Army-Test / Seliant, OpenExamPrep and the Institute of Psychometric Coaching were also used for cross-checking likely practice families. Where any secondary source conflicts with the revised official guide, this trainer follows the official guide.</p></div>
  <div class="card source-card"><h3><span class="badge medium">Anecdotal only</span> Reddit — AustralianMilitary / ADFRecruiting</h3><p>Used only for broad experience signals: candidates repeatedly describe intense time pressure, strategic skipping/flagging and value in becoming familiar with the format. No recalled or restricted live-test questions were copied. Current ADFRecruiting moderation also explicitly prohibits sharing specific JOA assessment content, so this tool stays with independently generated practice material.</p></div>
 </div>
 <section class="section"><h2>Question-family fidelity map</h2><table class="fidelity-table"><thead><tr><th>Training module</th><th>Fidelity</th><th>Why</th></tr></thead><tbody>
 ${PRACTICE_BANK_SUBTYPES.map(k=>[k,SUBTYPES[k]]).map(([k,v])=>`<tr><td>${v.cat} — ${v.name}</td><td><span class="badge ${v.fidelity.toLowerCase()}">${v.fidelity}</span></td><td>${v.basis}</td></tr>`).join("")}
 </tbody></table></section>
 <section class="card section" style="padding:20px"><h3>Question-bank QA</h3><p>This build uses a finite category-practice bank of <b>3,840 questions</b> (80 deterministic slots per difficulty band for each active question subtype) plus 18 audited Practice Test slots whose new attempts preferentially avoid questions already seen in saved test history. The full bank is exhaustively machine-checked before release for answer presence, selection counts, arithmetic consistency, matrix-rule ambiguity, correct-vs-incorrect visual distinguishability, clipping, reference/starting figures only where the prompt genuinely requires one, and deterministic regeneration. Semantic verbal templates are also manually reviewed. New completed full-test attempts save an exact snapshot of their 51 questions so later bank updates cannot change an old answer review.</p></section><section class="card section" style="padding:20px"><h3>Difficulty calibration</h3><p>Easy / Medium / Hard badges are assigned by the <b>actual construction of each generated item</b>. Easy remains one-rule or immediately classifiable. Medium has been recalibrated upward to favour two-rule, reverse-operation, interleaved, conversion or two-attribute reasoning. Hard now more consistently uses layered dependencies, multi-stage numerical work, conditional/logical traps, multiple simultaneous visual attributes, close reflection/rotation distractors or changing/interleaved rule systems. A regression guard still explicitly classifies simple A-B-A-B number alternation as Easy.</p></section><section class="card section" style="padding:20px"><h3>What this tool does not claim</h3><p>It does not claim to reproduce proprietary JOA questions, exact scoring, role cut-scores, adaptive behaviour, official item difficulty labels or an unpublished official section split. ADF Mentors describes a score above 30/51 as a strong practice result in its own simulation material, but this trainer deliberately does <b>not</b> turn that secondary-source statement into a pass mark, occupational cut-score or official ADF benchmark. “Same difficulty as JOA” is therefore a best-match simulation tier based on the official public examples and current Australian JOA-focused descriptions, not an ADF-issued difficulty rating.</p></section>
 </main>`;
}

<script>
(function(){
  function bootLooksHealthy(){
    var app=document.getElementById("app");
    return !!(app && app.querySelector(".topbar") && app.textContent.trim().length>80);
  }
  window.addEventListener("load",function(){
    setTimeout(function(){
      if(bootLooksHealthy()){
        try{sessionStorage.removeItem("joaTrainerBootRecoveryAttempt");}catch(_){}
        return;
      }
      var attempt=0;
      try{attempt=Number(sessionStorage.getItem("joaTrainerBootRecoveryAttempt")||0);}catch(_){}
      if(attempt<1){
        try{sessionStorage.setItem("joaTrainerBootRecoveryAttempt","1");}catch(_){}
        var url=new URL(window.location.href);
        url.searchParams.set("boot-recovery",String(Date.now()));
        window.location.replace(url.toString());
        return;
      }
      /* Never leave the user with an unexplained blank white app. */
      var app=document.getElementById("app");
      if(app){
        app.innerHTML='<main style="max-width:720px;margin:40px auto;padding:24px;font:16px system-ui;color:#123b55"><h2>Trainer did not finish loading</h2><p>Please close and reopen the web app, or tap the version number on Home to check for the latest build. Your saved Practice Test history has not been deleted.</p></main>';
      }
    },1200);
  });
})();
</script>
