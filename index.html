<link rel="icon" type="image/png" sizes="64x64" href="./favicon-dark.png" media="(prefers-color-scheme: dark)">
<link rel="shortcut icon" type="image/png" href="./favicon-light.png">
<link id="appleTouchIcon" rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-light.png">
<script>
(function(){
  const link = document.getElementById("appleTouchIcon");
  if (!link || !window.matchMedia) return;
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const apply = () => {
    link.href = mq.matches ? "./apple-touch-icon-dark.png" : "./apple-touch-icon-light.png";
  };
  apply();
  if (mq.addEventListener) mq.addEventListener("change", apply);
  else if (mq.addListener) mq.addListener(apply);
})();
</script>

<style>
:root{
  /* Air Force-inspired palette: blue, white and red.
     This is an independent trainer, not an official Air Force visual identity implementation. */
  --bg:#eef5f9; --panel:#ffffff; --ink:#0d2941; --muted:#61798b; --line:#c9d9e4;
  --nav:#082f4f; --nav2:#124e78; --accent:#c92d3b; --accent2:#a91f2d;
  --sky:#68a9cf; --sky-deep:#327ba8; --sky-soft:#e5f2f8;
  --good:#1f7555; --warn:#9a6700; --bad:#b22d3a; --soft:#e7f1f6; --flag:#e9b83e;
  --shadow:0 8px 24px rgba(8,47,79,.09);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;touch-action:manipulation}
button{cursor:pointer}
a{color:#1a5d82}
.hidden{display:none!important}
.shell{min-height:100vh;min-height:100dvh}
.topbar{background:linear-gradient(90deg,var(--nav),#0b3c61);color:#fff;padding:calc(14px + env(safe-area-inset-top)) calc(24px + env(safe-area-inset-right)) 14px calc(24px + env(safe-area-inset-left));display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(0,0,0,.18);border-bottom:3px solid var(--sky)}
.brand{font-weight:850;letter-spacing:.02em;font-size:19px;white-space:nowrap;display:inline-flex;align-items:center;gap:.28em;line-height:1}
.brand span{color:#f2f7fa}.brand:before{content:"";display:block;flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:8px;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.topnav{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.topnav button{border:0;background:transparent;color:#dbe3e8;padding:9px 12px;border-radius:8px;font-weight:700;min-height:44px}
.topnav button:hover,.topnav button.active{background:var(--nav2);color:white}
.container{max-width:1180px;margin:0 auto;padding:28px 22px 50px}
.hero{display:grid;grid-template-columns:1.4fr .85fr;gap:24px;align-items:stretch;margin-bottom:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.hero-main{padding:30px}
.kicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--sky-deep);margin-bottom:8px}
h1{font-size:38px;line-height:1.05;margin:0 0 12px}
h2{margin:0 0 14px;font-size:26px}
h3{margin:0 0 10px;font-size:19px}
p{line-height:1.55}
.lead{font-size:18px;color:#3f505b;max-width:800px}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:#475862}
.badge.high{border-color:#a8d2bf;color:#176343;background:#f0faf5}
.badge.medium{border-color:#e4c687;color:#855700;background:#fff9ea}
.badge.official{border-color:#b9c8d2;color:#324c5d;background:#f4f8fa}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.stat{background:linear-gradient(180deg,#f8fbfd,var(--soft));border:1px solid #d5e4ed;border-radius:11px;padding:15px}
.stat b{display:block;font-size:25px}
.stat span{font-size:12px;color:var(--muted);font-weight:700}
.hero-side{padding:24px;display:flex;flex-direction:column;justify-content:space-between}
.notice{padding:13px 15px;border-left:4px solid var(--accent);background:#fff4f5;border-radius:8px;color:#5b2630;font-size:14px;line-height:1.45}
.notice.blue{border-left-color:var(--sky-deep);background:var(--sky-soft);color:#234a63}
.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:800;background:var(--accent);color:#fff;min-height:44px}
.btn:hover{background:var(--accent2)}
.btn.secondary{background:#dfeef6;color:#183d56}
.btn.secondary:hover{background:#cfe4ef}
.btn.ghost{background:white;color:#26343e;border:1px solid var(--line)}
.btn.small{padding:8px 11px;font-size:13px;min-height:40px}
.btn.good{background:var(--good)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.category-card{padding:20px;position:relative;overflow:hidden}
.category-card .num{font-size:38px;font-weight:900;color:#cbdfea;position:absolute;right:16px;top:10px}
.category-card ul{padding-left:18px;color:#4f5e67;line-height:1.7}
.category-card .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.section{margin-top:28px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:14px}
.section-head p{margin:0;color:var(--muted)}
.mock-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mock-card{padding:18px}
.mock-card .mockno{font-size:12px;font-weight:900;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.mock-card strong{display:block;font-size:20px;margin:6px 0}
.mock-card p{font-size:13px;color:var(--muted);min-height:42px}
.progress-strip{height:7px;background:#e6ecef;border-radius:999px;overflow:hidden;margin:12px 0}
.progress-strip span{display:block;height:100%;background:var(--accent)}
.practice-layout{display:grid;grid-template-columns:280px 1fr;gap:18px}
.sidebar{padding:18px;align-self:start;position:sticky;top:82px}
.side-title{font-weight:900;margin-bottom:10px}
.side-list{display:grid;gap:7px}
.side-list button{text-align:left;padding:10px;border:1px solid transparent;background:#f5f7f8;border-radius:8px;font-weight:750;color:#354650;min-height:44px}
.side-list button.active{border-color:#8ebbd5;background:#e9f4fa;color:#164f73}
.practice-main{padding:22px}
.practice-header{padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.practice-header h2{margin-bottom:12px}
.practice-badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.practice-badges .basis-badge{white-space:normal;line-height:1.3}
.practice-banknote{display:block;margin-top:12px;font-size:12px;line-height:1.45;color:var(--muted);font-weight:650}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;padding:14px;background:#f7f9fa;border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
.field label{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px}
.field select{padding:10px 36px 10px 10px;border:1px solid #cfd8dd;border-radius:8px;background:white;min-height:44px}
.helpbox{border:1px solid #cfdbe2;border-radius:11px;background:#f7fbfd;padding:18px;margin-bottom:18px}
.helpbox summary{font-weight:900;cursor:pointer}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:13px}
.help-grid ul{margin:5px 0;padding-left:18px;line-height:1.55;color:#40525d}
.workedbox{border:1px solid #b9d2e1;border-radius:11px;background:#ffffff;padding:18px;margin-bottom:18px;box-shadow:0 4px 14px rgba(8,47,79,.05)}
.workedbox summary{font-weight:900;cursor:pointer;color:#174c6d}
.worked-intro{font-size:13px;color:var(--muted);margin:10px 0 14px}
.worked-examples{display:grid;gap:14px}
.worked-example{border:1px solid #d7e4ec;border-left:4px solid var(--sky-deep);border-radius:9px;padding:15px;background:#f9fcfd}
.worked-example h4{margin:0 0 8px;font-size:15px;color:#173e58}
.worked-question{font-weight:800;margin-bottom:9px}
.worked-steps{margin:0;padding-left:20px;line-height:1.55;color:#40596a}
.worked-steps li{margin:4px 0}
.worked-answer{margin-top:10px;padding:8px 10px;border-radius:7px;background:var(--sky-soft);font-weight:800;color:#174c6d}
.tip-chip{display:inline-block;font-size:11px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;background:#dcecf5;color:#285c7b;border-radius:999px;padding:4px 8px;margin-bottom:8px}
.drill-card{border-top:4px solid var(--sky-deep);padding:22px}
.qmeta{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px}
.qmeta .left{display:flex;gap:8px;flex-wrap:wrap}
.prompt{font-size:18px;font-weight:760;line-height:1.45;margin:12px 0 18px}
.sequence{font-size:24px;font-weight:850;letter-spacing:.06em;text-align:center;padding:18px;background:#f7f9fa;border-radius:10px;margin:10px 0 18px}
.matrix{margin:10px auto 18px;border-collapse:collapse}
.matrix td{width:64px;height:54px;text-align:center;border:2px solid #6c7981;font-size:21px;font-weight:800;background:white}
.options{display:grid;gap:9px}
.option{border:1px solid #cfd7dc;border-radius:9px;background:white;padding:12px 14px;text-align:left;display:flex;gap:11px;align-items:center;transition:.12s;min-height:48px}
.option:hover{border-color:#9fb2bd;background:#f8fbfc}
.option.selected{border-color:var(--sky-deep);background:#eaf5fb}
.option.correct{border-color:#66a988;background:#effaf5}
.option.wrong{border-color:#d58d8d;background:#fff2f2}
.option .letter{width:27px;height:27px;border-radius:50%;background:#edf1f3;display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 auto}
.visual-options{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:12px}
.visual-option{border:1px solid #cfd7dc;border-radius:10px;padding:10px;background:white;text-align:center;min-height:112px}
.visual-option.selected{border-color:var(--sky-deep);background:#eaf5fb}
.visual-option.correct{border-color:#66a988;background:#effaf5}
.visual-option.wrong{border-color:#d58d8d;background:#fff2f2}
.fig{display:flex;justify-content:center;align-items:center;min-height:88px}
.answer-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.numinput{padding:11px 12px;border:1px solid #bfcbd2;border-radius:8px;width:190px;font-size:18px;min-height:48px}
.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;border-left:4px solid #8aa1ae;background:#f4f7f8}
.feedback.good{border-left-color:var(--good);background:#f1faf5}
.feedback.bad{border-left-color:var(--bad);background:#fff2f2}
.feedback b{display:block;margin-bottom:5px}
.test-shell{background:linear-gradient(to bottom,var(--nav) 0,var(--nav) env(safe-area-inset-top),#fff env(safe-area-inset-top),#fff 100%);min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.test-head{min-height:44px;background:#e7eaec;border-bottom:1px solid #bfc6ca;padding:7px 12px;font-weight:850;font-size:13px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}.test-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.test-qcount{white-space:nowrap}.test-exit{border:1px solid #b9c3c9;background:#fff;color:#7d2630;border-radius:7px;min-height:34px;padding:5px 10px;font-weight:900}.test-exit:hover{background:#fff2f3;border-color:#d09a9f}
.test-body{display:grid;grid-template-columns:185px 1fr;min-height:calc(100vh - 99px)}
.test-side{background:#e4e6e7;border-right:1px solid #b9c0c4;padding:12px;display:flex;flex-direction:column}
.status-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:8px 0 15px}
.status-grid button{border:1px solid #aeb7bc;background:#f8f9f9;height:25px;font-size:10px;padding:0}
.status-grid button.answered{background:#c7d1d6}
.status-grid button.flagged{outline:2px solid var(--flag);outline-offset:-2px}
.status-grid button.current{background:var(--sky-deep);color:white;border-color:var(--sky-deep)}
.legend{font-size:11px;display:grid;gap:6px;color:#43515a}
.legend span i{display:inline-block;width:13px;height:13px;border:1px solid #abb4b9;vertical-align:-2px;margin-right:5px;background:white}
.legend span i.ans{background:#c7d1d6}
.legend span i.flg{border:2px solid var(--flag)}
.timerbox{margin-top:auto;border-top:1px solid #aab2b7;padding-top:12px}
.timerbar{height:13px;background:#c7d0d4;border:1px solid #98a4aa}
.timerbar span{height:100%;display:block;background:var(--sky-deep);width:100%}
.time{font-weight:900;font-variant-numeric:tabular-nums;margin-top:5px}
.test-main{display:flex;flex-direction:column}
.test-question{flex:1;padding:28px 36px 20px;max-width:1050px;width:100%;margin:0 auto}
.test-nav{background:#e5e7e8;border-top:1px solid #b8c0c4;padding:11px 18px;display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;z-index:20;padding-bottom:max(11px,env(safe-area-inset-bottom))}
.test-nav .middle{display:flex;gap:8px}
.result-card{padding:24px}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
.result-stat{padding:15px;background:#f3f6f7;border-radius:10px}
.result-stat b{font-size:26px;display:block}
.breakdown{width:100%;border-collapse:collapse;margin-top:12px}
.breakdown th,.breakdown td{text-align:left;border-bottom:1px solid var(--line);padding:10px}
.review-item{padding:18px;border:1px solid var(--line);border-radius:10px;margin-top:10px;background:white}
.sources{display:grid;gap:12px}
.source-card{padding:18px}
.source-card h3{display:flex;align-items:center;gap:8px}
.source-card p{margin-bottom:0;color:#4f606a}
.fidelity-table{width:100%;border-collapse:collapse;background:white}
.fidelity-table th,.fidelity-table td{border-bottom:1px solid var(--line);padding:11px;text-align:left;vertical-align:top}
.fidelity-table th{background:#f4f7f8}
.footer{margin-top:35px;color:#6c7880;font-size:12px;line-height:1.5}
.version-stamp{font-size:9px;line-height:1;color:rgba(97,121,139,.72);text-align:center;letter-spacing:.04em;padding:8px max(12px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));user-select:none}

.smallnote{font-size:12px;color:var(--muted)}
.svg-seq{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0 18px}
.svg-frame{width:102px;height:88px;border:1px solid #cbd4d9;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center}


/* Difficulty badges are assigned from the actual generated rule complexity, not just the requested band. */
.badge.diff-easy{border-color:#a8d2bf;color:#176343;background:#f0faf5}
.badge.diff-medium{border-color:#d6bd74;color:#76510a;background:#fff9ea}
.badge.diff-hard{border-color:#d79aa2;color:#8d2430;background:#fff1f3}
.difficulty-audit{margin-top:8px;font-size:11px;line-height:1.45;color:var(--muted)}

/* Category drills open as an in-page modal so the first question cannot appear unnoticed below the fold. */
body.drill-open{overflow:hidden}
.drill-modal{position:fixed;inset:0;z-index:120;background:rgba(5,31,51,.72);display:flex;align-items:flex-start;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));overflow:auto;-webkit-overflow-scrolling:touch}
.drill-dialog{width:min(920px,100%);background:var(--panel);border:1px solid #b9cfdd;border-radius:16px;box-shadow:0 22px 70px rgba(2,26,44,.32);overflow:hidden;margin:auto}
.drill-modal-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;background:linear-gradient(90deg,var(--nav),#0b3c61);color:#fff;border-bottom:3px solid var(--sky)}
.drill-modal-head strong{font-size:15px}
.drill-modal-head .smallnote{color:#dceaf2}
.drill-close{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.10);color:#fff;border-radius:8px;min-width:44px;min-height:40px;padding:7px 11px;font-weight:800}
.drill-dialog .drill-card{border-top:0}

/* Full-test difficulty groups and persistent test history. */
.mock-tier{margin-top:24px}
.mock-tier:first-of-type{margin-top:0}
.mock-tier-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:12px}
.mock-tier-head p{margin:4px 0 0;color:var(--muted);max-width:780px}
.tier-pill{display:inline-flex;align-items:center;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;white-space:nowrap}
.tier-pill.easier{background:#eef9f4;color:#176343;border:1px solid #acd4c1}
.tier-pill.joa{background:#eaf4fa;color:#1d5d82;border:1px solid #a7c9dd}
.tier-pill.harder{background:#fff1f3;color:#8d2430;border:1px solid #d9a0a7}
.history-actions{display:flex;gap:8px;flex-wrap:wrap}
.history-list{display:grid;gap:12px;margin-top:16px}
.history-item{padding:18px}
.history-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.history-title{font-weight:900;font-size:17px;margin-bottom:5px}
.history-meta{font-size:12px;color:var(--muted);line-height:1.55}
.history-score{font-size:26px;font-weight:900;color:var(--ink);white-space:nowrap}
.history-stats{display:flex;gap:12px;flex-wrap:wrap;margin:13px 0;color:#496071;font-size:13px}
.history-empty{padding:24px;text-align:center;color:var(--muted)}
.danger-btn{background:#fff;color:var(--bad);border:1px solid #d9a0a7}
.danger-btn:hover{background:#fff1f3}

.mobile-test-tools{display:none}
.mobile-status-scroll{display:flex;gap:5px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mobile-status-scroll::-webkit-scrollbar{display:none}
.mobile-status-scroll button{flex:0 0 38px;height:38px;border:1px solid #aeb7bc;background:#f8f9f9;border-radius:7px;font-size:12px;font-weight:800}
.mobile-status-scroll button.answered{background:#c7d1d6}
.mobile-status-scroll button.flagged{outline:2px solid var(--flag);outline-offset:-2px}
.mobile-status-scroll button.current{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep)}
.mobile-test-topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mobile-test-tools .timerbar{flex:1;min-width:120px}
.mobile-test-tools .time{margin:0;white-space:nowrap;font-size:13px}
.mobile-swipe-note{display:none;font-size:11px;color:var(--muted);text-align:center;margin:4px 0 0}

@media(max-width:1024px){
 .container{padding-left:20px;padding-right:20px}
 .mock-grid{grid-template-columns:repeat(2,1fr)}
 .hero{gap:18px}
}

@media(max-width:900px){
 .hero,.practice-layout{grid-template-columns:1fr}
 .hero-main{padding:26px}
 .grid3{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(2,1fr)}
 .sidebar{position:static;padding:10px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
 .sidebar::-webkit-scrollbar{display:none}
 .sidebar .side-title{display:none}
 .sidebar .side-list{display:flex;gap:7px;flex:0 0 auto}
 .sidebar .side-list button{white-space:nowrap}
 .practice-main{padding:20px}
 .help-grid{grid-template-columns:1fr}
 .test-question{padding:24px 24px 18px}
 .result-grid{grid-template-columns:repeat(2,1fr)}
 .source-card h3{flex-wrap:wrap}
 .fidelity-table{font-size:13px}
}

@media(max-width:820px){
 .test-body{grid-template-columns:1fr;min-height:calc(100dvh - 99px)}
 .test-side{display:none}
 .mobile-test-tools{display:block;background:#eef3f6;border-bottom:1px solid #bdcbd4;padding:10px 14px}
 .mobile-swipe-note{display:block}

/* v1.5 Mental Math keypad: contiguous hit zones + inset visible key faces */
.mental-keypad{
  gap:0 !important;
  max-width:380px;
  width:100%;
  margin:0 auto;
}
.mental-key{
  min-height:66px;
  padding:0 !important;
  margin:0;
  border:0 !important;
  background:transparent !important;
  box-shadow:none !important;
  display:flex;
  align-items:stretch;
  justify-content:stretch;
  position:relative;
}
.mental-key-face{
  pointer-events:none;
  width:calc(100% - 8px);
  min-height:58px;
  margin:4px;
  padding:12px 8px;
  border:1px solid #b9cad4;
  background:#fff;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-sizing:border-box;
  font-size:22px;
  line-height:1;
  font-weight:900;
  color:#183f58;
  box-shadow:0 1px 2px rgba(8,47,79,.05);
}
.mental-key.utility .mental-key-face{
  font-size:15px;
  background:#eef4f7;
}
.mental-key.enter .mental-key-face{
  background:#1f6f9f;
  color:#fff;
  border-color:#1f6f9f;
  min-height:58px;
}
.mental-key.mental-key-flash .mental-key-face{
  background:#dceef8;
  border-color:#4c91b8;
}
.mental-key.enter.mental-key-flash .mental-key-face{
  background:#185f89;
  border-color:#185f89;
}

/* v1.6 iPhone-width hamburger navigation */
.mobile-menu-toggle,
.mobile-nav-drawer,
.mobile-nav-backdrop{display:none}

.mobile-menu-toggle{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.08);
  color:#fff;
  padding:0;
  align-items:center;
  justify-content:center;
}
.mobile-menu-toggle:active{background:rgba(255,255,255,.16)}
.mobile-menu-icon{
  width:21px;
  height:16px;
  position:relative;
  display:block;
}
.mobile-menu-icon span{
  position:absolute;
  left:0;
  width:21px;
  height:2px;
  border-radius:2px;
  background:#fff;
  transition:transform .16s ease,opacity .16s ease,top .16s ease;
}
.mobile-menu-icon span:nth-child(1){top:0}
.mobile-menu-icon span:nth-child(2){top:7px}
.mobile-menu-icon span:nth-child(3){top:14px}
.mobile-menu-toggle[aria-expanded="true"] .mobile-menu-icon span:nth-child(1){top:7px;transform:rotate(45deg)}
.mobile-menu-toggle[aria-expanded="true"] .mobile-menu-icon span:nth-child(2){opacity:0}
.mobile-menu-toggle[aria-expanded="true"] .mobile-menu-icon span:nth-child(3){top:7px;transform:rotate(-45deg)}

.mobile-nav-drawer{
  position:fixed;
  z-index:42;
  left:calc(10px + env(safe-area-inset-left));
  right:calc(10px + env(safe-area-inset-right));
  top:calc(64px + env(safe-area-inset-top));

/* v1.12 adaptive single-row primary navigation */
.topbar{
  flex-wrap:nowrap;
}
.topbar>.brand{
  flex:0 0 auto;
}
.topbar>.topnav{
  flex:1 1 auto;
  flex-wrap:nowrap;
  white-space:nowrap;
  overflow:visible;
}
.topbar>.topnav button{
  flex:0 0 auto;
  white-space:nowrap;
  transition:padding .12s ease,font-size .12s ease,gap .12s ease;
}

/* First compression step: intended mainly for iPad landscape / smaller laptops. */
.topbar.nav-compact{
  gap:12px;
  padding-left:calc(16px + env(safe-area-inset-left));
  padding-right:calc(16px + env(safe-area-inset-right));
}
.topbar.nav-compact .brand{
  font-size:18px;
}
.topbar.nav-compact>.topnav{
  gap:3px;
}
.topbar.nav-compact>.topnav button{
  padding:8px 8px;
  font-size:14px;
}

/* Final readable compression step before switching to hamburger. */
.topbar.nav-tight{
  gap:9px;
  padding-left:calc(12px + env(safe-area-inset-left));
  padding-right:calc(12px + env(safe-area-inset-right));
}
.topbar.nav-tight .brand{
  font-size:17px;
  gap:.22em;
}
.topbar.nav-tight .brand:before{
  margin-right:5px;
  width:9px;
  height:9px;
  flex-basis:9px;
}
.topbar.nav-tight>.topnav{
  gap:1px;
}
.topbar.nav-tight>.topnav button{
  padding:7px 5px;
  font-size:13px;
  min-height:42px;
}

/* JS can invoke hamburger at any width once the readable compact layout no longer fits. */
.topbar.nav-hamburger .brand{
  margin-right:auto;
}
.topbar.nav-hamburger .mobile-menu-toggle{
  display:flex !important;
  order:2;
  margin-left:auto;
}
.topbar.nav-hamburger>.topnav{
  display:none !important;
}
.mobile-nav-drawer.adaptive-hamburger{
  left:auto;
  right:calc(10px + env(safe-area-inset-right));
  width:min(330px,calc(100vw - 20px - env(safe-area-inset-left) - env(safe-area-inset-right)));
}

/* At phone widths the existing hamburger behaviour remains immediate. */
@media(max-width:640px){
  .topbar.nav-compact,
  .topbar.nav-tight{
    padding-left:calc(10px + env(safe-area-inset-left));
    padding-right:calc(10px + env(safe-area-inset-right));
  }
}

/* v1.15 hamburger menu behaves as a true modal layer */
html.mobile-menu-open{
  overflow:hidden;

}

  position:fixed;
  width:100%;
  left:0;
  right:0;
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:none;
}

.mobile-nav-backdrop.open{
  display:block;
  touch-action:none;
  overscroll-behavior:none;
}

/*
  The drawer is constrained between the header and the device safe-area.
  If the list is taller than the available landscape height, only the
  drawer scrolls — never the page behind it.
*/
.mobile-nav-drawer{
  bottom:calc(8px + env(safe-area-inset-bottom));
  max-height:none;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  touch-action:pan-y;
  scrollbar-gutter:stable;
}
.mobile-nav-drawer.open{
  display:block;
}
.mobile-nav-drawer button{
  touch-action:manipulation;
}

/* Short iPhone landscape: reclaim a little vertical space. */
@media(max-height:520px){

    bottom:calc(6px + env(safe-area-inset-bottom));

  }
}


/* v1.16 hamburger close control + content-sized drawer */

/*
  Lift the top bar above the backdrop only while the menu is open,
  then recreate the same dimming over the bar itself. The active
  close/cross button sits above that local dim layer, so it remains
  fully bright and clearly interactive while the rest of the header
  stays visually de-emphasised.
*/
body.mobile-menu-open .topbar{
  z-index:43;
}
body.mobile-menu-open .topbar::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:rgba(3,25,40,.34);
}
body.mobile-menu-open .mobile-menu-toggle{
  position:relative;
  z-index:2;
  opacity:1;
}

/*
  Content-sized by default. The box only grows as tall as its menu
  items + padding, but can never exceed the available viewport height.
*/
.mobile-nav-drawer{
  bottom:auto !important;
  height:auto;
  max-height:calc(100dvh - 80px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  box-sizing:border-box;
  overflow-y:auto;
  overflow-x:hidden;
}

/* Short iPhone landscape: keep the same content-hugging behaviour,
   with a tighter maximum height so the drawer remains fully reachable. */
@media(max-height:520px){
  .mobile-nav-drawer{
    bottom:auto !important;
    max-height:calc(100dvh - 60px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  }
}

/* ===========================================================
   v1.18 iPad navigation + version-stamp consistency
   =========================================================== */

/*
  Do not animate font-size/padding when a navigation mode changes.
  This removes the soft/interpolated text effect during orientation
  changes and keeps the chosen layout visually crisp.
*/
.topbar>.topnav button{
  transition:none !important;
}

/*
  iPad landscape target:
  keep the full-size IMG-1-style typography (19px brand / 16px menu)
  and gain the required horizontal room by trimming spacing only.
  Text is NOT shrunk to the old compact/tight 14px/13px sizes.
*/
.topbar.nav-tablet-landscape{
  gap:14px;
  padding-left:calc(18px + env(safe-area-inset-left));
  padding-right:calc(18px + env(safe-area-inset-right));
}
.topbar.nav-tablet-landscape .brand{
  font-size:19px;
  gap:.28em;
}
.topbar.nav-tablet-landscape .brand:before{
  width:10px;
  height:10px;
  flex-basis:10px;
  margin-right:8px;
}
.topbar.nav-tablet-landscape>.topnav{
  gap:2px;
}
.topbar.nav-tablet-landscape>.topnav button{
  padding:9px 9px;
  font-size:16px;
  min-height:44px;
}

/*
  Portrait tablet fallback:
  never squeeze the entire seven-item menu into tiny text.
  The hamburger is the readable presentation in tablet portrait.
  This CSS is also a failsafe if iPadOS misses an orientation event.
*/
@media (orientation:portrait) and (min-width:641px) and (max-width:1200px){
  .topbar>.topnav{
    display:none !important;
  }
  .topbar .mobile-menu-toggle{
    display:flex !important;
    order:2;
    margin-left:auto;
  }
  .topbar .brand{
    margin-right:auto;
    font-size:19px !important;
  }
}

/*
  Landscape tablet failsafe: preserve full-size text even if a stale
  compact/tight class somehow survives an iPadOS viewport transition.
*/
@media (orientation:landscape) and (min-width:1000px) and (max-width:1400px){
  .topbar:not(.nav-hamburger){
    gap:14px !important;
    padding-left:calc(18px + env(safe-area-inset-left)) !important;
    padding-right:calc(18px + env(safe-area-inset-right)) !important;
  }
  .topbar:not(.nav-hamburger) .brand{
    font-size:19px !important;
  }
  .topbar:not(.nav-hamburger)>.topnav{
    display:flex !important;
    gap:2px !important;
  }
  .topbar:not(.nav-hamburger)>.topnav button{
    font-size:16px !important;
    padding:9px 9px !important;
    min-height:44px !important;
  }
}

/*
  Make the page a simple vertical flex layout so the existing version
  stamp can sit at the bottom of a short page instead of just below a
  full-viewport .shell. This keeps it visible in iPad portrait while
  preserving normal document flow on longer pages.
*/
html,body{
  min-height:100%;
}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
.shell{
  min-height:0 !important;
  flex:1 0 auto;
  width:100%;
}
#uiModalRoot{
  flex:0 0 auto;
}
.version-stamp{
  flex:0 0 auto;
  width:100%;
  display:block !important;
  visibility:visible !important;
}

/* Keep the invisible Home refresh hit-area fully functional in either orientation. */
.version-refresh-hit.home-refresh-enabled{
  pointer-events:auto !important;
  cursor:pointer;
}

function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; } }
function ri(r,min,max){ return Math.floor(r()*(max-min+1))+min; }
function pick(r,arr){ return arr[Math.floor(r()*arr.length)]; }
function shuffle(r,arr){ const x=[...arr]; for(let i=x.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[x[i],x[j]]=[x[j],x[i]];} return x; }
function fmt(n){ return Number.isInteger(n)?String(n):String(Math.round(n*100)/100); }
function uniqOptions(correct, vals, r){
  const a=[correct,...vals].map(v=>typeof v==="number"?Math.round(v*100)/100:v);
  const unique=[]; a.forEach(v=>{if(!unique.some(x=>String(x)===String(v))) unique.push(v)});
  while(unique.length<4){ let v=typeof correct==="number"?correct+ri(r,-9,9):"Option "+unique.length; if(!unique.some(x=>String(x)===String(v))) unique.push(v); }
  return shuffle(r,unique.slice(0,4));
}
function qbase(seed, subtype, difficulty){return {id:`${subtype}-${seed}`,subtype,category:SUBTYPES[subtype].cat,difficulty};}

function requestedBand(d){ return ["easy","medium","hard"].includes(d)?d:"medium"; }
function setDifficulty(q,d,reason){ q.difficulty=d; q.difficultyReason=reason; return q; }

function genNumSeries(seed,difficulty="medium"){
  const r=rng(seed), band=requestedBand(difficulty), q=qbase(seed,"numSeries",band);
  let seq=[],ans,rule,reason;
  const type=ri(r,0,2);
  if(band==="easy"){
    if(type===0){
      const a=ri(r,2,20),d=ri(r,2,9); seq=[a,a+d,a+2*d,a+3*d,a+4*d]; ans=a+5*d;
      rule=`add ${d} each time`; reason="One obvious arithmetic rule with a constant difference.";
    }else if(type===1){
      let a=ri(r,3,15),b=ri(r,16,30); if(a===b)b++;
      seq=[a,b,a,b,a,b]; ans=a; rule=`alternate ${a}, ${b}`;
      reason="A simple two-value alternation (A, B, A, B...). This is always Easy, including patterns such as 8, 18, 8, 18...";
    }else{
      const a=ri(r,2,7),m=pick(r,[2,3]); seq=[a,a*m,a*m*m,a*m*m*m]; ans=a*m*m*m*m;
      rule=`multiply by ${m} each time`; reason="One obvious repeated multiplication rule.";
    }
  }else if(band==="medium"){
    if(type===0){
      const a=ri(r,3,12),d=ri(r,2,5),inc=ri(r,1,3); seq=[a];
      for(let i=0;i<4;i++)seq.push(seq.at(-1)+d+i*inc); ans=seq.at(-1)+d+4*inc;
      rule=`the differences increase by ${inc}: ${[0,1,2,3,4].map(i=>d+i*inc).join(", ")}`;
      reason="Requires a second-level pattern in the differences, but only one derived sequence.";
    }else if(type===1){
      const a=ri(r,8,25),up=ri(r,5,11),down=ri(r,2,6); seq=[a];
      for(let i=0;i<5;i++)seq.push(seq.at(-1)+(i%2===0?up:-down)); ans=seq[5]; seq=seq.slice(0,5);
      rule=`alternate +${up}, −${down}`; reason="Requires recognising two alternating arithmetic operations.";
    }else{
      const base=ri(r,3,12),step=ri(r,3,9); seq=[base,base+step,base+step,base+2*step,base+2*step]; ans=base+3*step;
      rule=`each new value is repeated twice while increasing by ${step}`; reason="Requires noticing both repetition and a separate arithmetic progression.";
    }
  }else{
    if(type===0){
      const a=ri(r,2,10),b=ri(r,18,35),d1=ri(r,2,6),d2=ri(r,3,8); seq=[a,b,a+d1,b+d2,a+2*d1,b+2*d2]; ans=a+3*d1;
      rule=`two interleaved sequences: odd positions +${d1}, even positions +${d2}`;
      reason="Requires splitting the terms into two interleaved sequences and solving the correct strand.";
    }else if(type===1){
      const a=ri(r,2,6),d=ri(r,1,3); seq=[a]; let diff=d;
      for(let i=0;i<4;i++){seq.push(seq.at(-1)+diff);diff*=2;} ans=seq.at(-1)+diff;
      rule="the amount added doubles after each step"; reason="Requires deriving a changing-difference rule whose increments themselves grow geometrically.";
    }else{
      const a=ri(r,2,6),m=pick(r,[2,3]),add=ri(r,2,6); seq=[a];
      seq.push(seq.at(-1)*m); seq.push(seq.at(-1)+add); seq.push(seq.at(-1)*m); seq.push(seq.at(-1)+add); ans=seq.at(-1)*m;
      rule=`alternate ×${m}, then +${add}`; reason="Requires identifying and maintaining two different alternating operations under time pressure.";
    }
  }
  q.prompt="What number comes next?"; q.display={type:"sequence",values:[...seq,"?"]};
  q.kind="single"; q.options=uniqOptions(ans,[ans+ri(r,1,5),ans-ri(r,1,5),ans+ri(r,6,12)],r); q.answer=ans;
  q.explanation=`The rule is: ${rule}. Therefore the missing value is ${ans}.`;
  return setDifficulty(q,band,reason);
}

function matrixPlausiblePredictions(grid){
 const rows=grid.map(row=>row.map(v=>v===null?null:v));
 const a3=rows[2][0],b3=rows[2][1],preds=[];
 const funcs=[];
 const add=(name,fn)=>funcs.push([name,fn]);
 add("a+b",(a,b)=>a+b);add("a-b",(a,b)=>a-b);add("b-a",(a,b)=>b-a);add("a*b",(a,b)=>a*b);
 add("2a+b",(a,b)=>2*a+b);add("a+2b",(a,b)=>a+2*b);add("2a-b",(a,b)=>2*a-b);add("2b-a",(a,b)=>2*b-a);
 for(const m of [2,3,4]){add(`(a+b)*${m}`,(a,b)=> (a+b)*m);add(`a*${m}+b`,(a,b)=>a*m+b);add(`a+b*${m}`,(a,b)=>a+b*m);}
 for(let k=-6;k<=6;k++){add(`a+b+${k}`,(a,b)=>a+b+k);add(`a*b+${k}`,(a,b)=>a*b+k);}
 for(const [name,fn] of funcs){if(fn(rows[0][0],rows[0][1])===rows[0][2]&&fn(rows[1][0],rows[1][1])===rows[1][2])preds.push({name,value:fn(a3,b3)});}
 return preds;
}
function matrixIsClear(grid,intendedAnswer){
 if(grid[0][0]===grid[1][0]&&grid[0][1]===grid[1][1])return false;
 const preds=matrixPlausiblePredictions(grid),values=[...new Set(preds.map(x=>x.value))];
 return values.length===1&&values[0]===intendedAnswer;
}

function genNumMatrix(seed,difficulty="medium"){
  const r=rng(seed),band=requestedBand(difficulty),q=qbase(seed,"numMatrix",band); let grid,ans,rule,reason;
  const type=band==="easy"?ri(r,0,3):ri(r,0,2);
  if(band==="easy"){
    if(type===0){
      const rows=Array.from({length:3},()=>{const a=ri(r,2,12),b=ri(r,2,12);return [a,b,a+b]}); ans=rows[2][2]; rows[2][2]=null; grid=rows;
      rule="in each row, third = first + second"; reason="A single direct addition relationship repeated across rows.";
    }else if(type===1){
      const rows=Array.from({length:3},()=>{const b=ri(r,2,8),c=ri(r,2,9),a=b+c;return [a,b,c]}); ans=rows[2][2]; rows[2][2]=null; grid=rows;
      rule="in each row, third = first − second"; reason="A single direct subtraction relationship repeated across rows.";
    }else if(type===2){
      const a=ri(r,2,10),h=ri(r,2,5),v=ri(r,2,5); grid=[[a,a+h,a+2*h],[a+v,a+v+h,a+v+2*h],[a+2*v,a+2*v+h,null]]; ans=a+2*v+2*h;
      rule=`move right +${h}; move down +${v}`; reason="A simple constant-step grid; either the row or column pattern leads directly to the same answer.";
    }else{
      const rows=Array.from({length:3},()=>{const a=ri(r,2,9),b=ri(r,2,7);return [a,b,a*b]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule="in each row, third = first × second"; reason="One direct multiplication relationship repeated across rows.";
    }
  }else if(band==="medium"){
    if(type===0){
      const rows=Array.from({length:3},()=>{const a=ri(r,2,9),b=ri(r,2,9);return [a,b,a+2*b]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule="in each row, third = first + (2 × second)"; reason="A consistent two-step arithmetic rule must be inferred from complete rows.";
    }else if(type===1){
      const rows=Array.from({length:3},()=>{const a=ri(r,2,9),b=ri(r,2,9);return [a,b,2*a+b]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule="in each row, third = (2 × first) + second"; reason="A consistent two-step arithmetic rule must be inferred from complete rows.";
    }else{
      const k=ri(r,2,6),rows=Array.from({length:3},()=>{const a=ri(r,3,10),b=ri(r,2,9);return [a,b,a+b+k]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule=`in each row, third = first + second + ${k}`; reason="A two-step additive rule with a hidden constant must be inferred.";
    }
  }else{
    if(type===0){
      const k=ri(r,2,5),rows=Array.from({length:3},()=>{const a=ri(r,3,9),b=ri(r,2,7);return [a,b,a*b+k]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule=`in each row, third = (first × second) + ${k}`; reason="Requires identifying a two-operation multiplicative rule and the hidden constant.";
    }else if(type===1){
      const k=ri(r,2,5),rows=Array.from({length:3},()=>{const a=ri(r,5,11),b=ri(r,2,7);return [a,b,a*b-k]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule=`in each row, third = (first × second) − ${k}`; reason="Requires multiplication plus a second operation, with plausible simpler rules acting as distractors.";
    }else{
      const m=pick(r,[2,3]),rows=Array.from({length:3},()=>{const a=ri(r,2,8),b=ri(r,2,8);return [a,b,(a+b)*m]}); ans=rows[2][2];rows[2][2]=null;grid=rows;
      rule=`in each row, third = (first + second) × ${m}`; reason="Requires recognising operation order across two linked arithmetic steps.";
    }
  }
  if(!matrixIsClear(grid,ans))return genNumMatrix(seed+104729,band);
  q.prompt="What number should replace the question mark in the matrix?";q.display={type:"matrix",grid:grid.map(row=>row.map(v=>v===null?"?":v))};q.kind="numeric";q.answer=ans;
  q.explanation=`Use the same rule on the complete rows: ${rule}. The missing value is ${ans}.`;
  return setDifficulty(q,band,reason);
}

function genWordProblem(seed,difficulty="medium"){
  const r=rng(seed),band=requestedBand(difficulty),q=qbase(seed,"wordProblems",band); let ans,prompt,exp,reason;
  const type=ri(r,0,2);
  if(band==="easy"){
    if(type===0){
      const speed=pick(r,[12,15,20,24,25,30]),time=pick(r,[2,3,4,5]),dist=speed*time;ans=time;
      prompt=`A vehicle travels ${dist} kilometres at an average speed of ${speed} km/h. How many hours does the journey take?`;
      exp=`time = distance ÷ speed = ${dist} ÷ ${speed} = ${ans} hours.`;reason="One direct rate calculation with an integer result.";
    }else if(type===1){
      const total=pick(r,[80,120,160,200,240,320]),pct=pick(r,[10,25,50]);ans=total*pct/100;
      prompt=`A unit has ${total} items. ${pct}% are allocated for training. How many items is that?`;
      exp=`${pct}% of ${total} = ${ans}.`;reason="One-step percentage using a common mental-maths fraction (10%, 25% or 50%).";
    }else{
      const workers=pick(r,[3,4,5]),per=pick(r,[6,8,10]),hours=pick(r,[2,3]);ans=workers*per*hours;
      prompt=`${workers} people each process ${per} forms per hour. How many forms do they process altogether in ${hours} hours?`;
      exp=`${workers} × ${per} × ${hours} = ${ans}.`;reason="Straightforward multiplication with all required values stated directly.";
    }
  }else if(band==="medium"){
    if(type===0){
      const a=ri(r,2,6),b=ri(r,2,6),unit=ri(r,4,12),total=(a+b)*unit;ans=a*unit;
      prompt=`Red and blue markers are in the ratio ${a}:${b}. There are ${total} markers altogether. How many are red?`;
      exp=`Total ratio parts = ${a+b}. One part = ${unit}. Red = ${a} × ${unit} = ${ans}.`;reason="Requires converting a ratio into total parts before calculating the requested share.";
    }else if(type===1){
      const n=pick(r,[4,5,6]),avg=ri(r,12,25),sum=avg*n;let known=[];
      for(let i=0;i<n-1;i++)known.push(ri(r,8,28)); const knownSum=known.reduce((a,b)=>a+b,0);ans=sum-knownSum;
      if(ans<2||ans>45)return genWordProblem(seed+311,band);
      prompt=`The average of ${n} scores is ${avg}. ${n-1} scores are ${known.join(", ")}. What is the remaining score?`;
      exp=`Required total = ${avg} × ${n} = ${sum}. Known total = ${knownSum}. Missing = ${ans}.`;reason="Requires reversing an average: find the target total, then subtract several known values.";
    }else{
      const packs=ri(r,3,8),each=pick(r,[8,10,12,15]),pct=pick(r,[75,80,90]),total=packs*each;ans=total*pct/100;
      if(!Number.isInteger(ans))return genWordProblem(seed+613,band);
      prompt=`There are ${packs} packs with ${each} components in each pack. If ${pct}% pass inspection, how many components pass?`;
      exp=`Total = ${packs} × ${each} = ${total}. Then ${pct}% of ${total} = ${ans}.`;reason="A genuine two-stage problem: calculate the total first, then apply a less-trivial percentage.";
    }
  }else{
    if(type===0){
      const total=pick(r,[200,240,300,400]),reserved=pick(r,[20,25,30]),use=pick(r,[20,25,50]);const rem=total*(100-reserved)/100;ans=rem*use/100;
      if(!Number.isInteger(ans))return genWordProblem(seed+719,band);
      prompt=`A store holds ${total} items. ${reserved}% are reserved and cannot be used. Of the remaining items, ${use}% are issued. How many items are issued?`;
      exp=`Remaining = ${total} × ${100-reserved}% = ${rem}. Issued = ${use}% of ${rem} = ${ans}.`;reason="Two dependent percentage stages; the second percentage applies to a changed base, a common time-pressure trap.";
    }else if(type===1){
      const w1=ri(r,3,5),rate=pick(r,[6,8,10]),h1=pick(r,[2,3]),extra=ri(r,1,3),h2=1;ans=w1*rate*h1+(w1+extra)*rate*h2;
      prompt=`${w1} people process ${rate} forms each per hour for ${h1} hours. Then ${extra} more people join for 1 further hour at the same individual rate. How many forms are processed altogether?`;
      exp=`First stage: ${w1} × ${rate} × ${h1} = ${w1*rate*h1}. Second stage: ${w1+extra} × ${rate} = ${(w1+extra)*rate}. Total = ${ans}.`;reason="Requires calculating and combining two work-rate stages after the group size changes.";
    }else{
      const a=ri(r,2,5),b=ri(r,4,7),unit=pick(r,[6,8,10]),total=(a+b)*unit,move=pick(r,[2,3,4]);ans=a*unit+move;
      prompt=`Red and blue markers are in the ratio ${a}:${b}, with ${total} markers altogether. Then ${move} blue markers are moved into the red group. How many red markers are there now?`;
      exp=`Initially red = ${a}/${a+b} of ${total} = ${a*unit}. After moving ${move}, red = ${ans}.`;reason="Requires solving a ratio first, then correctly applying a second change to the result.";
    }
  }
  q.prompt=prompt;q.kind=band==="hard"?"numeric":"single";q.answer=ans;
  if(q.kind==="single")q.options=uniqOptions(ans,[ans+pick(r,[2,4,5,10]),ans-pick(r,[1,3,5]),ans*2],r);
  q.explanation=exp;return setDifficulty(q,band,reason);
}

function figSvg(spec,w=118,h=82){

    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><circle cx="${cx}" cy="${cy}" r="31" fill="white" stroke="#222" stroke-width="1.5"/>${dots}</svg>`;
  }
  if(spec.type==="block"){
    const shade=spec.shade==="dark"?"#111":"#fff",studs=spec.studs||3;let st="";const start=cx-(studs-1)*9;
    for(let i=0;i<studs;i++)st+=`<ellipse cx="${start+i*18}" cy="${cy-20}" rx="5" ry="2.8" fill="#e8e8e8" stroke="#333" stroke-width="1"/>`;
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><polygon points="${cx-35},${cy-22} ${cx+25},${cy-22} ${cx+35},${cy-14} ${cx-25},${cy-14}" fill="${shade}" stroke="#333"/><rect x="${cx-35}" y="${cy-22}" width="60" height="34" fill="none" stroke="#333"/><polygon points="${cx+25},${cy-22} ${cx+35},${cy-14} ${cx+35},${cy+14} ${cx+25},${cy+12}" fill="#f2f2f2" stroke="#333"/>${st}</svg>`;
  }
  const shape=spec.shape||"arrow",rot=spec.rot||0,fill=spec.fill==="outline"?"white":"#1c2830";let body="";
  if(shape==="arrow")body=`<path d="M ${cx-26} ${cy-8} H ${cx+6} V ${cy-20} L ${cx+28} ${cy} L ${cx+6} ${cy+20} V ${cy+8} H ${cx-26} Z" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
  if(shape==="triangle")body=`<polygon points="${cx},${cy-27} ${cx+27},${cy+22} ${cx-27},${cy+22}" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
  if(shape==="square")body=`<rect x="${cx-23}" y="${cy-23}" width="46" height="46" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
  if(shape==="diamond")body=`<polygon points="${cx},${cy-28} ${cx+28},${cy} ${cx},${cy+28} ${cx-28},${cy}" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
  if(shape==="circle")body=`<circle cx="${cx}" cy="${cy}" r="25" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
  if(shape==="L")body=`<path d="M ${cx-23} ${cy-28} H ${cx-5} V ${cy+10} H ${cx+26} V ${cy+28} H ${cx-23} Z" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
  const marker=spec.marker?`<circle cx="${cx-14}" cy="${cy-17}" r="4" fill="${spec.marker==="white"?"white":"#c92d3b"}" stroke="#222"/>`:"";

function calibrateDifficulty(q){
  // Regression guard for the exact class of issue reported by the user: A,B,A,B,A,B is never Hard.
  if(q.subtype==="numSeries" && q.display?.type==="sequence"){
    const vals=q.display.values.filter(v=>v!=="?");
    if(vals.length>=5 && vals.every((v,i)=>v===vals[i%2])){
      q.difficulty="easy";
      q.difficultyReason="Simple two-value alternation (A, B, A, B...) — explicitly classified Easy.";
    }
  }
  return q;
}
function generate(subtype,seed,difficulty="medium",attempt=0){
  const band=requestedBand(difficulty); let q;
  if(subtype==="numSeries")q=genNumSeries(seed,band);
  else if(subtype==="numMatrix")q=genNumMatrix(seed,band);
  else if(subtype==="wordProblems")q=genWordProblem(seed,band);
  else if(subtype==="oddWords")q=genOddWords(seed,band);
  else if(subtype==="analogy")q=genAnalogy(seed,band);
  else if(subtype==="wordRelation")q=genWordRelation(seed,band);
  else if(subtype==="deduction")q=genDeduction(seed,band);
  else if(subtype==="abstractOdd")q=genAbstractOdd(seed,band);
  else if(subtype==="abstractSequence")q=genAbstractSequence(seed,band);
  else if(subtype==="rotation")q=genRotation(seed,band);
  else if(subtype==="multiAttribute")q=genMultiAttribute(seed,band);
  q=calibrateDifficulty(q);q.requestedDifficulty=band;
  // If a future generator ever creates something that the calibration rubric downgrades/upgrades,
  // regenerate instead of displaying a false badge.
  if(q.difficulty!==band && attempt<12)return generate(subtype,seed+104729,band,attempt+1);
  return q;
}

function withFamily(q,family){
 q.family=family;

}
function stableCanonical(value){
 if(Array.isArray(value))return value.map(stableCanonical);
 if(value&&typeof value==="object"){
   const out={};
   Object.keys(value).sort().forEach(k=>{
     if(!["id","testNo","difficultyReason","requestedDifficulty","family"].includes(k))out[k]=stableCanonical(value[k]);
   });
   return out;
 }
 return value;
}
function questionFingerprint(q){
 const options=q.options?[...q.options].map(String).sort():null;
 const visuals=q.visualOptions?q.visualOptions.map(v=>JSON.stringify(stableCanonical(v))).sort():null;
 return JSON.stringify(stableCanonical({
   subtype:q.subtype,
   prompt:q.prompt,
   display:q.display||null,
   options,
   visuals
 }));
}
function questionFamily(q){
 return q.family||`${q.subtype}-${q.difficulty}`;
}

 if(band==="easy"){

   }else if(type===2){

   }else{

     reason="Simple A-B-A-B alternation, explicitly retained as Easy.";
   }
 }else if(band==="medium"){
   if(type===0){
     const a=ri(r,3,15),d=ri(r,2,6),inc=ri(r,2,4);seq=[a];
     for(let i=0;i<5;i++)seq.push(seq.at(-1)+d+i*inc);
     ans=seq.at(-1)+d+5*inc;seq=seq.slice(0,6);
     rule=`differences increase by ${inc}: ${[0,1,2,3,4,5].map(i=>d+i*inc).join(", ")}`;
     family="series-growing-differences";reason="Requires deriving a second-level pattern across several differences.";
   }else if(type===1){
     const a=ri(r,15,35),up=ri(r,7,14),down=ri(r,3,8);seq=[a];
     for(let i=0;i<6;i++)seq.push(seq.at(-1)+(i%2===0?up:-down));

     rule=`alternate +${up}, −${down}`;family="series-alternating-add-subtract";

   }else if(type===2){

   }else if(type===3){
     const a=ri(r,2,8),m=2,k=ri(r,3,8);seq=[a];
     seq.push(seq.at(-1)*m);seq.push(seq.at(-1)+k);seq.push(seq.at(-1)*m);seq.push(seq.at(-1)+k);seq.push(seq.at(-1)*m);ans=seq.at(-1)+k;

   }
 }else{
   if(type===0){

     seq=[a,b,a*m,b+d,a*m*m,b+2*d];ans=a*m*m*m;

     ans=seq[6];seq=seq.slice(0,6);

     const nextFirstDiff=firstDiffs.at(-1)+nextSecondDiff;
     rule=`first differences are ${firstDiffs.map(x=>"+"+x).join(", ")}. Those differences themselves increase by ${secondDiffs.map(x=>"+"+x).join(", ")}, so the next increase is +${nextSecondDiff}; the next first difference is +${nextFirstDiff}`;
     family="series-third-level-differences";reason="Requires recognising a pattern in how the differences themselves change.";
   }else if(type===5){
     const a=ri(r,2,7),m=2,k1=ri(r,1,4),k2=ri(r,2,5);seq=[a];

   }
 }

 q.prompt="What number comes next?";
 q.display={type:"sequence",values:[...seq,"?"]};
 q.kind="single";
 q.options=uniqOptions(ans,[ans+ri(r,2,7),ans-ri(r,2,7),ans+ri(r,9,18)],r);
 q.answer=ans;
 q.explanation=`The rule is: ${rule}. Therefore the missing value is ${ans}.`;
 return withFamily(setDifficulty(q,band,reason),family);
}

/* ---------- Matrix QA3 ---------- */
function matrixPlausiblePredictionsV3(grid){
 const rows=grid.map(row=>row.map(v=>v===null?null:v));
 const a3=rows[2][0],b3=rows[2][1],preds=[];
 const funcs=[];
 const add=(name,fn)=>funcs.push([name,fn]);
 add("a+b",(a,b)=>a+b);add("a-b",(a,b)=>a-b);add("b-a",(a,b)=>b-a);add("a*b",(a,b)=>a*b);
 add("2a+b",(a,b)=>2*a+b);add("a+2b",(a,b)=>a+2*b);add("2a-b",(a,b)=>2*a-b);add("2b-a",(a,b)=>2*b-a);
 for(const m of [2,3,4]){
   add(`(a+b)*${m}`,(a,b)=>(a+b)*m);
   add(`a*${m}+b`,(a,b)=>a*m+b);
   add(`a+b*${m}`,(a,b)=>a+b*m);
 }
 for(let k=-8;k<=8;k++){
   add(`a+b+${k}`,(a,b)=>a+b+k);
   add(`a*b+${k}`,(a,b)=>a*b+k);
   add(`2a+b+${k}`,(a,b)=>2*a+b+k);
   add(`a+2b+${k}`,(a,b)=>a+2*b+k);
 }
 for(const [name,fn] of funcs){
   if(fn(rows[0][0],rows[0][1])===rows[0][2]&&fn(rows[1][0],rows[1][1])===rows[1][2]){
     preds.push({name,value:fn(a3,b3)});
   }
 }
 return preds;
}
function matrixIsClearV3(grid,intendedAnswer){
 if(grid[0][0]===grid[1][0]&&grid[0][1]===grid[1][1])return false;
 const values=[...new Set(matrixPlausiblePredictionsV3(grid).map(x=>x.value))];
 return values.length===1&&values[0]===intendedAnswer;
}
function genNumMatrixV3(seed,difficulty="medium"){
 const r=rng(seed),band=requestedBand(difficulty),q=qbase(seed,"numMatrix",band);
 let grid,ans,rule,reason,family;
 const type=band==="easy"?ri(r,0,3):band==="medium"?ri(r,0,4):ri(r,0,4);
 const rowsFrom=fn=>Array.from({length:3},()=>{let a=ri(r,3,11),b=ri(r,2,9),c=fn(a,b);return [a,b,c]});

 if(band==="easy"){
   if(type===0){let rows=rowsFrom((a,b)=>a+b);ans=rows[2][2];rows[2][2]=null;grid=rows;rule="third = first + second";family="matrix-add";reason="One repeated addition relationship.";}
   else if(type===1){let rows=Array.from({length:3},()=>{const b=ri(r,2,8),c=ri(r,2,9),a=b+c;return [a,b,c]});ans=rows[2][2];rows[2][2]=null;grid=rows;rule="third = first − second";family="matrix-subtract";reason="One repeated subtraction relationship.";}
   else if(type===2){const a=ri(r,2,10),h=ri(r,2,5),v=ri(r,2,5);grid=[[a,a+h,a+2*h],[a+v,a+v+h,a+v+2*h],[a+2*v,a+2*v+h,null]];ans=a+2*v+2*h;rule=`move right +${h}; move down +${v}`;family="matrix-grid-steps";reason="Simple row/column constant-step grid.";}
   else{let rows=rowsFrom((a,b)=>a*b);ans=rows[2][2];rows[2][2]=null;grid=rows;rule="third = first × second";family="matrix-multiply";reason="One repeated multiplication relationship.";}
 }else if(band==="medium"){
   if(type===0){let rows=rowsFrom((a,b)=>a+2*b);ans=rows[2][2];rows[2][2]=null;grid=rows;rule="third = first + (2 × second)";family="matrix-a-plus-2b";}
   else if(type===1){let rows=rowsFrom((a,b)=>2*a+b);ans=rows[2][2];rows[2][2]=null;grid=rows;rule="third = (2 × first) + second";family="matrix-2a-plus-b";}
   else if(type===2){let rows=Array.from({length:3},()=>{const b=ri(r,2,7),a=ri(r,b+2,b+10);return [a,b,2*a-b]});ans=rows[2][2];rows[2][2]=null;grid=rows;rule="third = (2 × first) − second";family="matrix-2a-minus-b";}
   else if(type===3){let rows=Array.from({length:3},()=>{const a=ri(r,2,7),b=ri(r,a+2,a+10);return [a,b,2*b-a]});ans=rows[2][2];rows[2][2]=null;grid=rows;rule="third = (2 × second) − first";family="matrix-2b-minus-a";}
   else{const k=ri(r,3,8);let rows=rowsFrom((a,b)=>a+b+k);ans=rows[2][2];rows[2][2]=null;grid=rows;rule=`third = first + second + ${k}`;family="matrix-sum-plus-constant";}
   reason="Requires inferring and applying a two-operation row rule; simple addition or multiplication alone is insufficient.";
 }else{
   if(type===0){const k=ri(r,3,7);let rows=rowsFrom((a,b)=>a*b+k);ans=rows[2][2];rows[2][2]=null;grid=rows;rule=`third = (first × second) + ${k}`;family="matrix-product-plus-constant";}
   else if(type===1){const k=ri(r,3,7);let rows=Array.from({length:3},()=>{let a=ri(r,4,10),b=ri(r,3,8);return [a,b,a*b-k]});ans=rows[2][2];rows[2][2]=null;grid=rows;rule=`third = (first × second) − ${k}`;family="matrix-product-minus-constant";}
   else if(type===2){const m=pick(r,[2,3]);let rows=rowsFrom((a,b)=>(a+b)*m);ans=rows[2][2];rows[2][2]=null;grid=rows;rule=`third = (first + second) × ${m}`;family="matrix-sum-times";}
   else if(type===3){const k=ri(r,2,6);let rows=rowsFrom((a,b)=>2*a+b+k);ans=rows[2][2];rows[2][2]=null;grid=rows;rule=`third = (2 × first) + second + ${k}`;family="matrix-2a-b-plus-constant";}
   else{const k=ri(r,2,6);let rows=Array.from({length:3},()=>{const a=ri(r,3,10),b=ri(r,4,11);return [a,b,a+2*b-k]});ans=rows[2][2];rows[2][2]=null;grid=rows;rule=`third = first + (2 × second) − ${k}`;family="matrix-a-2b-minus-constant";}
   reason="Requires a layered operation with multiplication/weighting plus an additional constant or operation-order step.";
 }

 if(!matrixIsClearV3(grid,ans))return genNumMatrixV3(seed+104729,band);
 q.prompt="What number should replace the question mark in the matrix?";
 q.display={type:"matrix",grid:grid.map(row=>row.map(v=>v===null?"?":v))};
 q.kind="numeric";q.answer=ans;
 q.explanation=`Use the same rule on the complete rows: ${rule}. The missing value is ${ans}.`;
 return withFamily(setDifficulty(q,band,reason),family);
}

     q.prompt="Which figure should come next when ALL attributes are continued?";q.display={type:"figSequence",frames};q.kind="visualSingle";q.visualOptions=shuffle(r,opts);
     q.answer=q.visualOptions.findIndex(o=>o.shape===correct.shape&&o.rot===correct.rot&&o.fill===correct.fill&&String(o.marker||"")===String(correct.marker||""));
     q.explanation=`Shape alternates, orientation advances ${step}°, and fill alternates. All three attributes must be correct.`;
     family="multi-three-attribute-sequence";
   }else{
     const axis=start%180,shape=pick(r,["arrow","L"]);
     let specs=[];
     for(const rot of [start,(start+45)%360,(start+90)%360,(start+135)%360,(start+180)%360,(start+225)%360]){
       const onAxis=(rot%180)===axis;
       specs.push({type:"shape",shape,rot,fill:onAxis?"solid":"outline",marker:shape==="L"?"accent":undefined});
     }
     const bad=shuffle(r,[0,1,2,3,4,5]).slice(0,2);
     bad.forEach(i=>specs[i]={...specs[i],fill:specs[i].fill==="solid"?"outline":"solid"});
     specs=shuffle(r,specs);
     q.prompt="Which TWO figures break the combined orientation and fill rule?";
     q.kind="visualMulti";q.visualOptions=specs;
     q.answer=specs.map((x,i)=>({x,i})).filter(({x})=>{
       const onAxis=(x.rot%180)===axis;
       return x.fill!==(onAxis?"solid":"outline");
     }).map(z=>z.i);
     if(q.answer.length!==2)return genMultiAttributeV3(seed+4099,band);
     q.maxSelect=2;
     q.explanation="Four figures follow the same axis-to-fill rule. Two reverse it and are the outsiders.";
     family="multi-relational-odd-two";
   }
   reason="Requires simultaneously checking multiple attributes and rejecting close options that satisfy only part of the rule.";
 }

}

/* ---------- QA3 dispatcher ---------- */
function generateV3(subtype,seed,difficulty="medium",attempt=0){
 const band=requestedBand(difficulty);let q;
 if(subtype==="numSeries")q=genNumSeriesV3(seed,band);
 else if(subtype==="numMatrix")q=genNumMatrixV3(seed,band);
 else if(subtype==="wordProblems")q=genWordProblemV3(seed,band);
 else if(subtype==="oddWords")q=genOddWordsV3(seed,band);
 else if(subtype==="analogy")q=genAnalogyV3(seed,band);
 else if(subtype==="wordRelation")q=genWordRelationV3(seed,band);
 else if(subtype==="deduction")q=genDeductionV3(seed,band);
 else if(subtype==="abstractOdd")q=genAbstractOddV3(seed,band);
 else if(subtype==="abstractSequence")q=genAbstractSequenceV3(seed,band);
 else if(subtype==="rotation")q=genRotationV3(seed,band);
 else if(subtype==="multiAttribute")q=genMultiAttributeV3(seed,band);
 q=calibrateDifficulty(q);q.requestedDifficulty=band;
 if(q.difficulty!==band&&attempt<16)return generateV3(subtype,seed+104729,band,attempt+1);
 return q;
}

function genNumValueV4(seed,difficulty="medium"){

 let options=[],values=[],family,reason;

 function addUnique(label,value){

   if(seed%2===0){

   }

 }else if(band==="medium"){

   }else if(seed%3===1){
     while(options.length<5){
       if(options.length%2===0){
         const d=pick(r,[5,8,10,12]),n=ri(r,1,d-1);addUnique(`${n}/${d}`,n/d);
       }else{
         const val=ri(r,18,92)/100;addUnique(val.toFixed(2),val);
       }
     }
     family="numvalue-mixed-forms";
   }else{
     const base=ri(r,20,80)/10;

       const val=base+ri(r,1,95)/1000;

   }
   reason="Requires comparing unlike denominators, mixed representations or closer decimal values rather than obvious whole-number differences.";
 }else{

function mutateAccuracyV5(r,s,type){

   badPair=pick(r,badPool);ruleId="sum-nine";ruleText="the outer and inner straight-side counts add to nine";
 }

 let specs=normalPairs.map((pair,i)=>({type:"nested",outer:pair.outer,inner:pair.inner,rot:angles[i]}));
 specs.push({type:"nested",outer:badPair.outer,inner:badPair.inner,rot:angles[4],bad:true});
 specs=shuffle(r,specs);

 q.prompt="Which ONE panel does not follow the same relationship between the outer and inner shapes?";
 q.kind="visualSingle";q.visualOptions=specs;q.answer=specs.findIndex(x=>x.bad);

   if(spec.shape==="trapezoid")body=`<polygon points="${cx-20},${cy-25} ${cx+20},${cy-25} ${cx+31},${cy+24} ${cx-31},${cy+24}" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
   if(spec.shape==="parallelogram")body=`<polygon points="${cx-18},${cy-25} ${cx+31},${cy-25} ${cx+18},${cy+25} ${cx-31},${cy+25}" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
   if(spec.shape==="pentagon")body=`<polygon points="${cx},${cy-29} ${cx+28},${cy-8} ${cx+17},${cy+27} ${cx-17},${cy+27} ${cx-28},${cy-8}" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
   if(spec.shape==="rectangle")body=`<rect x="${cx-31}" y="${cy-20}" width="62" height="40" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
   if(spec.shape==="hexagon")body=`<polygon points="${cx-28},${cy} ${cx-14},${cy-24} ${cx+14},${cy-24} ${cx+28},${cy} ${cx+14},${cy+24} ${cx-14},${cy+24}" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
   if(spec.shape==="cross")body=`<path d="M ${cx-10} ${cy-29} H ${cx+10} V ${cy-10} H ${cx+29} V ${cy+10} H ${cx+10} V ${cy+29} H ${cx-10} V ${cy+10} H ${cx-29} V ${cy-10} H ${cx-10} Z" fill="${fill}" stroke="#1c2830" stroke-width="2"/>`;
   return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}"><g transform="translate(${cx} ${cy}) rotate(${rot}) translate(${-cx} ${-cy})">${body}</g></svg>`;
 }
 return _figSvgV3(spec,w,h);
};

   Question Bank QA6 — visible equivalence + broad Word Problems

function angleMod(v,m){
 const x=((Number(v)||0)%m+m)%m;
 return Math.round(x*1000)/1000;
}
function visualAppearanceKey(spec){
 if(!spec)return "null";
 if(spec.type==="dots"){
   const n=spec.dots||3,period=360/Math.max(1,n);
   return `dots|${n}|${spec.dotFill||"solid"}|${angleMod(spec.rot||0,period)}`;
 }
 if(spec.type==="block")return `block|${spec.shade||""}|${spec.studs||3}`;
 if(spec.type==="nested")return `nested|${spec.outer}|${spec.inner}|${angleMod(spec.rot||0,360)}`;
 if(spec.type!=="shape")return JSON.stringify(stableCanonical(spec));
 let shape=spec.shape||"arrow",rot=Number(spec.rot)||0,mirror=!!spec.mirror;
 const fill=spec.fill||"solid",marker=spec.marker||"";
 if(shape==="circle")return `shape|circle|${fill}|${marker}|0|0`;
 if(["square","diamond","cross"].includes(shape)){mirror=false;rot=angleMod(rot,90);}
 else if(["rectangle","oval"].includes(shape)){mirror=false;rot=angleMod(rot,180);}
 else if(shape==="hexagon"){mirror=false;rot=angleMod(rot,60);}
 else if(["triangle","trapezoid","pentagon"].includes(shape)){mirror=false;rot=angleMod(rot,360);}
 else if(shape==="arrow"){if(mirror){rot+=180;mirror=false;}rot=angleMod(rot,360);}
 else rot=angleMod(rot,360);
 return `shape|${shape}|${fill}|${marker}|${rot}|${mirror?1:0}`;
}
function visualOptionsDistinctByAppearance(q){
 if(!Array.isArray(q.visualOptions))return true;
 const keys=q.visualOptions.map(visualAppearanceKey);
 return new Set(keys).size===keys.length;
}
function relationalVisualEvidenceValid(q){
 if(!q?.ruleMeta||q.ruleMeta.kind!=="orientation-fill")return true;
 const answers=new Set(Array.isArray(q.answer)?q.answer:[q.answer]);
 const normal=q.visualOptions.filter((_,i)=>!answers.has(i));
 const expected=x=>(((Number(x.rot)-q.ruleMeta.offset+3600)%q.ruleMeta.period)===0?"solid":"outline");
 if(normal.some(x=>x.fill!==expected(x)))return false;
 const solid=normal.filter(x=>x.fill==="solid").length,outline=normal.filter(x=>x.fill==="outline").length,min=q.ruleMeta.minNormalEachFill||1;
 return solid>=min&&outline>=min;
}

   QA7: explicit nested-shape validity + fuller numerical domains

function straightSideCount(shape){
 return ({circle:0,oval:0,triangle:3,square:4,diamond:4,rectangle:4,trapezoid:4,parallelogram:4,pentagon:5,hexagon:6,L:6,cross:12})[shape] ?? null;
}
function nestedEdgeEvidenceValid(q){
 if(q?.ruleMeta?.kind!=="nested-edge-relation")return true;
 const answers=new Set(Array.isArray(q.answer)?q.answer:[q.answer]),rule=q.ruleMeta.rule;
 const pairKeys=new Set();
 for(let i=0;i<q.visualOptions.length;i++){
   const x=q.visualOptions[i];
   if(x.type!=="nested"||x.outer===x.inner)return false;
   const outer=straightSideCount(x.outer),inner=straightSideCount(x.inner);
   if(outer===null||inner===null)return false;
   pairKeys.add(`${x.outer}|${x.inner}`);
   let normal=false;
   if(rule==="outer-one-more")normal=outer===inner+1;
   else if(rule==="absolute-difference-one")normal=Math.abs(outer-inner)===1;
   else if(rule==="sum-nine")normal=outer+inner===9;
   else return false;
   if(answers.has(i)?normal:!normal)return false;
 }
 // All five panels should not just be rotations of one or two repeated pairs.
 return pairKeys.size>=4;
}

function genSimpleAverageV6(seed){

 if(n===3)vals=[avg-spread,avg,avg+spread];
 else if(n===4)vals=[avg-spread,avg-spread,avg+spread,avg+spread];
 else vals=[avg-2*spread,avg-spread,avg,avg+spread,avg+2*spread];

 q.kind="single";q.answer=avg;q.options=uniqOptions(avg,[avg-spread,avg+spread,avg+2],r);
 q.explanation=`Add the ${n} readings to get ${vals.reduce((a,b)=>a+b,0)}, then divide by ${n}: average = ${avg}.`;

/* ---------- Diversity selection ---------- */
function familyBalancedPick(candidates,count,random,blockedFingerprints=new Set()){
 const unique=[];
 const seen=new Set(blockedFingerprints);
 for(const q of shuffle(random,candidates)){
   const fp=questionFingerprint(q);
   if(seen.has(fp))continue;
   seen.add(fp);unique.push(q);
 }
 const groups=new Map();
 for(const q of unique){
   const fam=questionFamily(q);
   if(!groups.has(fam))groups.set(fam,[]);
   groups.get(fam).push(q);
 }
 for(const arr of groups.values())arr.splice(0,arr.length,...shuffle(random,arr));
 const selected=[],counts=new Map();
 let lastFamily=null;
 while(selected.length<count){
   const available=[...groups.entries()].filter(([,arr])=>arr.length);
   if(!available.length)break;
   available.sort((a,b)=>{
     const ca=counts.get(a[0])||0,cb=counts.get(b[0])||0;
     if(ca!==cb)return ca-cb;
     if(a[0]===lastFamily&&b[0]!==lastFamily)return 1;
     if(b[0]===lastFamily&&a[0]!==lastFamily)return -1;
     return random()<.5?-1:1;
   });
   const [fam,arr]=available[0],q=arr.shift();
   selected.push(q);counts.set(fam,(counts.get(fam)||0)+1);lastFamily=fam;
 }
 return selected;
}

function buildDiverseSingleSubtypeSet(subtype,bands,random){
 const needs={easy:0,medium:0,hard:0};bands.forEach(b=>needs[b]++);
 const chosenByBand={easy:[],medium:[],hard:[]},globalSeen=new Set();
 for(const band of PRACTICE_BANK_BANDS){
   chosenByBand[band]=familyBalancedPick(bankCandidates(subtype,band),needs[band],random,globalSeen);
   chosenByBand[band].forEach(q=>globalSeen.add(questionFingerprint(q)));
   if(chosenByBand[band].length<needs[band]){
     // Deterministic fallback beyond the visible bank slots, only if a future
     // bank regression accidentally reduces unique candidates.
     for(let extra=0;chosenByBand[band].length<needs[band]&&extra<500;extra++){
       const q=generate(subtype,practiceBankSeed(subtype,band,extra%PRACTICE_BANK_SIZE_PER_DIFFICULTY)+7000003+extra*7919,band);
       const fp=questionFingerprint(q);if(globalSeen.has(fp))continue;
       chosenByBand[band].push(q);globalSeen.add(fp);
     }
   }
 }
 const indexes={easy:0,medium:0,hard:0};
 return bands.map(b=>chosenByBand[b][indexes[b]++]);

function buildDiverseCategoryMixSet(cat,bands,random){
 const types=byCat[cat],queues={},globalSeen=new Set();
 for(const st of types){
   queues[st]={easy:bankCandidates(st,"easy"),medium:bankCandidates(st,"medium"),hard:bankCandidates(st,"hard")};
 }
 const familyCounts=new Map(),subtypeCounts=new Map(),selected=[];
 let lastSubtype=null,lastFamily=null;
 for(let i=0;i<bands.length;i++){
   const band=bands[i];
   const subtypeOrder=[...types].sort((a,b)=>{
     const ca=subtypeCounts.get(a)||0,cb=subtypeCounts.get(b)||0;
     if(ca!==cb)return ca-cb;
     if(a===lastSubtype&&b!==lastSubtype)return 1;
     if(b===lastSubtype&&a!==lastSubtype)return -1;
     return random()<.5?-1:1;
   });
   let picked=null;
   for(const st of subtypeOrder){
     const candidates=shuffle(random,queues[st][band]).filter(q=>!globalSeen.has(questionFingerprint(q)));
     candidates.sort((a,b)=>{
       const fa=questionFamily(a),fb=questionFamily(b),ca=familyCounts.get(fa)||0,cb=familyCounts.get(fb)||0;
       if(ca!==cb)return ca-cb;
       if(fa===lastFamily&&fb!==lastFamily)return 1;
       if(fb===lastFamily&&fa!==lastFamily)return -1;
       return random()<.5?-1:1;
     });
     if(candidates.length){picked=candidates[0];break;}
   }
   if(!picked)throw new Error(`Unable to build unique ${cat} practice set`);
   selected.push(picked);
   const fp=questionFingerprint(picked),fam=questionFamily(picked);
   globalSeen.add(fp);familyCounts.set(fam,(familyCounts.get(fam)||0)+1);
   subtypeCounts.set(picked.subtype,(subtypeCounts.get(picked.subtype)||0)+1);
   lastSubtype=picked.subtype;lastFamily=fam;
 }
 return selected;
}

async function forceLatestOnlineVersion(){
 if(state.page!=="home")return;

 // Saved Practice Test history lives in localStorage and is never touched here.
 const hit=document.getElementById("versionRefreshHit");
 if(hit?.dataset.refreshing==="1")return;
 if(hit)hit.dataset.refreshing="1";

 try{
   const stamp=Date.now();
   const response=await fetch(`./index.html?version-check=${stamp}`,{cache:"no-store"});
   if(!response.ok)throw new Error(`HTTP ${response.status}`);
   const source=await response.text();
   const match=source.match(/<meta\s+name=["']app-version["']\s+content=["']([^"']+)["']/i);
   const onlineVersion=match?.[1]||null;

   if(!onlineVersion){
     await uiAlert("The online version could not be identified. Your saved progress has not been changed.","Update check");
     if(hit)delete hit.dataset.refreshing;
     return;
   }

   if(onlineVersion===APP_VERSION){
     await uiAlert(`You already have the latest version (v${APP_VERSION}).`,"No new version found");
     if(hit)delete hit.dataset.refreshing;
     return;
   }

   /*
     Validate that the fetched online document is a complete trainer shell
     before navigating away from the currently working build.
   */
   if(!source.includes('id="app"')||!source.includes("ADF JOA Trainer")||source.length<50000){
     throw new Error("Online app shell did not pass validation");
   }

   await uiAlert(`A newer version was found (v${onlineVersion}). The trainer will now update.`,"New version found","Update");

   try{
     sessionStorage.setItem("joaTrainerUpdateNotice",JSON.stringify({from:APP_VERSION,to:onlineVersion}));
     sessionStorage.setItem("joaTrainerExpectedVersion",onlineVersion);
   }catch(_){}

   /*
     Ask the registration to update, but DO NOT delete the active app cache
     before navigation. The new service worker deletes obsolete caches only
     after its own install has completed successfully.
   */
   if("serviceWorker" in navigator){
     const regs=await navigator.serviceWorker.getRegistrations();
     await Promise.all(regs.map(async reg=>{try{await reg.update();}catch(_){}}));
   }

   const url=new URL(window.location.href);
   url.searchParams.set("force-update",String(Date.now()));
   window.location.replace(url.toString());
 }catch(_){
   await uiAlert("The latest online version could not be checked or validated. Please confirm you are online and try again. Your saved progress has not been changed.","Update check failed");
   if(hit)delete hit.dataset.refreshing;
 }
}

let mainNavMode=null;
let mainNavOrientation=window.innerWidth>=window.innerHeight?"landscape":"portrait";
const mainNavModesByOrientation={portrait:null,landscape:null};

function mainNavClass(){
  return mainNavMode&&mainNavMode!=="normal"?`nav-${mainNavMode}`:"";
}
function mainNavDrawerClass(){
  return mainNavMode==="hamburger"?"adaptive-hamburger":"";
}
function navFitsSingleRow(topbar,nav){
  if(!topbar||!nav)return true;
  const brand=topbar.querySelector(".brand");
  if(!brand)return true;

  const style=getComputedStyle(topbar);
  const gap=parseFloat(style.columnGap||style.gap||0)||0;
  const padLeft=parseFloat(style.paddingLeft)||0;
  const padRight=parseFloat(style.paddingRight)||0;
  const available=topbar.clientWidth-padLeft-padRight-brand.getBoundingClientRect().width-gap;

  return nav.scrollWidth<=available+1;
}
function applyMainNavMode(){
  const topbar=document.querySelector(".topbar");
  const drawer=document.getElementById("mobileNavDrawer");
  if(!topbar)return;

  topbar.classList.remove("nav-compact","nav-tight","nav-tablet-landscape","nav-hamburger");
  drawer?.classList.remove("adaptive-hamburger");

  if(mainNavMode&&mainNavMode!=="normal")topbar.classList.add(`nav-${mainNavMode}`);
  if(mainNavMode==="hamburger")drawer?.classList.add("adaptive-hamburger");
}
function calculateMainNavMode(){
  const topbar=document.querySelector(".topbar");
  const nav=topbar?.querySelector(":scope > .topnav");
  const drawer=document.getElementById("mobileNavDrawer");
  if(!topbar||!nav)return mainNavMode||"normal";

  topbar.classList.remove("nav-compact","nav-tight","nav-tablet-landscape","nav-hamburger");
  drawer?.classList.remove("adaptive-hamburger");

  const portrait=window.innerHeight>window.innerWidth;

  /* iPhone / narrow handset */
  if(window.innerWidth<=640)return "hamburger";

  /* Tablet portrait: favour legibility over squeezing seven labels into one row. */
  if(portrait&&window.innerWidth<=1200)return "hamburger";

  /*
    Tablet landscape target. This is intentionally deterministic rather
    than measurement-sensitive, so the same iPad always returns to the
    same full-size visual treatment after rotating.
  */
  if(!portrait&&window.innerWidth>=1000&&window.innerWidth<=1400){
    return "tablet-landscape";
  }

  /* Normal desktop treatment whenever it fits. */
  if(navFitsSingleRow(topbar,nav))return "normal";

  /*
    For an unusually narrow desktop window, try the tablet-landscape
    spacing while retaining 16px menu text. If that still does not fit,
    switch to hamburger rather than shrinking the text below 16px.
  */
  topbar.classList.add("nav-tablet-landscape");
  const fitsTablet=navFitsSingleRow(topbar,nav);
  topbar.classList.remove("nav-tablet-landscape");
  return fitsTablet?"tablet-landscape":"hamburger";
}
function storeMainNavMode(mode){
  mainNavMode=mode;
  mainNavModesByOrientation[mainNavOrientation]=mode;
}
function adaptMainNav(force=false){
  /*
    Each orientation chooses its layout once and keeps it.
    Returning to landscape after visiting portrait therefore restores
    the exact original landscape sizing rather than recalculating it.
  */
  const cached=mainNavModesByOrientation[mainNavOrientation];

  if(!force&&mainNavMode!==null){
    applyMainNavMode();
    return;
  }
  if(!force&&cached!==null){
    mainNavMode=cached;
    applyMainNavMode();
    return;
  }

  closeMobileMenu();
  storeMainNavMode(calculateMainNavMode());
  applyMainNavMode();
}
function applyMainNavOrientation(orientation){
  if(orientation===mainNavOrientation)return;

  mainNavOrientation=orientation;
  closeMobileMenu();

  const cached=mainNavModesByOrientation[orientation];
  if(cached!==null){
    mainNavMode=cached;
    applyMainNavMode();
    return;
  }

  /*
    First visit to a new orientation: calculate once after the viewport
    settles, then cache that choice for future returns to this orientation.
  */
  mainNavMode=null;
  setTimeout(()=>adaptMainNav(true),140);
}
function currentMainNavOrientation(){
  return window.innerWidth>=window.innerHeight?"landscape":"portrait";
}

let mainNavOrientationTimer=null;
function scheduleMainNavOrientationCheck(){
  clearTimeout(mainNavOrientationTimer);
  mainNavOrientationTimer=setTimeout(()=>{
    applyMainNavOrientation(currentMainNavOrientation());
  },140);
}

/*
  iPadOS can fire several resize/orientation events while rotating.
  Debouncing them prevents a transient intermediate width from becoming
  the saved landscape layout.
*/
window.addEventListener("resize",scheduleMainNavOrientationCheck,{passive:true});
window.addEventListener("orientationchange",scheduleMainNavOrientationCheck,{passive:true});

function workedExampleAnswer(q){
 if(q.kind==="numeric")return String(q.answer);
 if(q.kind==="single")return String(q.answer);
 if(q.kind==="multi")return q.answer.join(" and ");
 if(q.kind==="visualSingle")return `${LETTERS[q.answer]}${q.visualOptions?.[q.answer]?.label?` — ${q.visualOptions[q.answer].label}`:""}`;
 if(q.kind==="visualMulti")return q.answer.map(i=>LETTERS[i]).join(" and ");
 return String(q.answer??"");
}
function workedExampleQuestionHtml(q){
 let html=`<div class="worked-question">${q.prompt}</div>`;
 if(q.display)html+=`<div class="worked-visual">${renderDisplay(q.display)}</div>`;

 if(q.kind==="single"||q.kind==="multi"){
   html+=`<div class="worked-choice-list">${q.options.map((o,i)=>`<div class="worked-choice-row"><span class="letter">${LETTERS[i]}</span><span>${o}</span></div>`).join("")}</div>`;
 }else if(q.kind==="visualSingle"||q.kind==="visualMulti"){
   html+=`<div class="worked-visual worked-visual-options">${q.visualOptions.map((o,i)=>`<div class="worked-visual-choice"><div class="fig">${figSvg(o,92,70)}</div><b>${LETTERS[i]}</b></div>`).join("")}</div>`;

 return html;
}

 steps.push(`<b>Apply it here:</b> ${q.explanation}`);
 steps.push(`<b>Why this is ${q.difficulty[0].toUpperCase()+q.difficulty.slice(1)}:</b> ${q.difficultyReason}`);

}

 let qs;
 if(!mixed){
   qs=buildDiverseSingleSubtypeSet(state.subtype,bands,random);
 }else{
   qs=buildDiverseCategoryMixSet(CATEGORY_MIXES[state.subtype].cat,bands,random);
 }
 if(qs.length!==state.settings.count||uniqueQuestionCount(qs)!==qs.length){
   throw new Error("Practice diversity guard failed: duplicate question detected.");
 }
 const label=mixed?CATEGORY_MIXES[state.subtype].name:SUBTYPES[state.subtype].name+" drill";
 state.practice={qs,index:0,answers:Array(qs.length).fill(null),checked:Array(qs.length).fill(false),start:Date.now(),qStart:Date.now(),times:Array(qs.length).fill(0),phase:"questions",reviewIndex:null,label};

function renderQuestion(q,ans,checked,mode){
 let d=q.display?renderDisplay(q.display):"";
 let body="";
 if(q.kind==="numeric"){
  body=`<input class="numinput" type="number" step="any" value="${ans??''}" ${checked?'disabled':''} oninput="${mode==='practice'?'setPracticeNumeric(this.value)':'setTestNumeric(this.value)'}" placeholder="Type answer">`;
 } else if(q.kind==="single"||q.kind==="multi"){
  body=`<div class="options">${q.options.map((o,i)=>{
   const sel=q.kind==="multi"?(ans||[]).includes(o):ans===o;
   const cls=checked?(isOptionCorrect(q,o,i)?'correct':sel?'wrong':''):(sel?'selected':'');
   return `<button class="option ${cls}" ${checked?'disabled':''} onclick="${mode==='practice'?`selectPractice(${i})`:`selectTest(${i})`}"><span class="letter">${LETTERS[i]}</span><span>${o}</span></button>`;
  }).join("")}</div>`;
 } else {
  body=`<div class="visual-options">${q.visualOptions.map((o,i)=>{
   const sel=q.kind==="visualMulti"?(ans||[]).includes(i):ans===i;
   const cls=checked?(isOptionCorrect(q,o,i)?'correct':sel?'wrong':''):(sel?'selected':'');
   return `<button class="visual-option ${cls}" ${checked?'disabled':''} onclick="${mode==='practice'?`selectPractice(${i})`:`selectTest(${i})`}"><div class="fig">${figSvg(o)}</div><div><b>${LETTERS[i]}</b></div></button>`;
  }).join("")}</div>`;
 }
 return `<div class="prompt">${q.prompt}</div>${d}${body}`;
}

 if(d.type==="matrix") return `<table class="matrix">${d.grid.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`).join("")}</table>`;

 if(d.type==="visualAnalogy") return `<div class="visual-analogy"><div class="visual-analogy-cell">${figSvg(d.a,90,68)}</div><span class="visual-analogy-word">is to</span><div class="visual-analogy-cell">${figSvg(d.b,90,68)}</div><span class="visual-analogy-word">as</span><div class="visual-analogy-cell">${figSvg(d.c,90,68)}</div><span class="visual-analogy-word">is to ?</span></div>`;
 return "";
}
function isOptionCorrect(q,o,i){
 if(q.kind==="single"||q.kind==="multi") return q.kind==="single"?String(o)===String(q.answer):q.answer.includes(o);
 return q.kind==="visualSingle"?i===q.answer:q.answer.includes(i);
}
function isCorrect(q,ans){
 if(ans===null||ans===undefined) return false;
 if(q.kind==="numeric") return Math.abs(Number(ans)-Number(q.answer))<1e-8;
 if(q.kind==="single") return String(ans)===String(q.answer);
 if(q.kind==="visualSingle") return ans===q.answer;
 const a=[...(ans||[])].map(String).sort(), b=[...q.answer].map(String).sort();
 return a.length===b.length&&a.every((x,i)=>x===b[i]);
}

 {id:"percentages",byBand:{easy:["word-simple-percent"],medium:["word-percent-increase","word-dependent-percent-medium","word-total-then-percent"],hard:["word-reverse-percent","word-successive-percent-change","word-dependent-percent-hard"]}},
